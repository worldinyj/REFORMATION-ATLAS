</style></head><body><a class="skip" href="#main">본문으로 건너뛰기</a><div class="layout"><aside><div class="brand"><small>HISTORY &amp; SOURCES</small><strong>REFORMATION<br>ATLAS</strong><em>V4.24 · EDITORIAL ALPHA</em></div><nav aria-label="콘텐츠 탐색"><button id="nav-volumes" data-go="#/volumes">01 여덟 권</button><button id="nav-themes" data-go="#/themes">02 여섯 주제</button><button id="nav-reader" data-go="#/reader/1">03 입문 원고</button><button id="nav-check" data-go="#/check">04 점검</button></nav><p>로컬에서 열 수 있는 콘텐츠 검토용 파일입니다.<br>외부 앱 배포와 구분합니다.</p></aside><div><header class="top"><span>L0 STORY INDEX · UNPUBLISHED PREVIEW</span><input id="search" type="search" aria-label="전체 콘텐츠 검색" placeholder="역사·인물·주제 검색" autocomplete="off"></header><main id="main" tabindex="-1" aria-live="polite"></main><footer>ATLAS V4.24 · 교열·권리·독자·실제 앱 검증 미완료 · can_ship=false</footer></div></div><script id="atlas-json" type="application/json">{"version":"V4.24","source_version":"V4.23","source_path":"research/data/V4_23_L0_INTERNAL_ALPHA_CONTENT_BUNDLE_DRAFT.json","source_sha":"ddf48f401ce4202166eedd308e1d5892f88ac0b8","can_ship":false,"volumes":[{"id":"VOL-01","title":"초대교회·고대교회","question":"누가 교회를 이루고 신앙을 설명했는가?","summary":"고대 기독교는 지중해·아프리카·서아시아에서 각기 다른 공동체와 언어로 형성되었다.","period":"1–5세기","body":"### VOL-01 — 초대교회·고대교회 | 누가 교회를 이루고 신앙을 설명했는가?\n\n초기 기독교 공동체는 예루살렘과 안디옥, 소아시아와 로마의 경로에만 존재하지 않았다. 알렉산드리아와 북아프리카, 시리아어권·메소포타미아, 아르메니아와 악숨에서도 서로 다른 언어와 정치질서 속에 교회가 형성됐다. 로마제국의 정책과 국경 밖 교회의 삶이 동일하지 않았으며, 주교·평신도·수도 공동체가 지닌 역할도 시간이 흐르며 변화했다.\n\n니케아(325)와 콘스탄티노폴리스(381)는 서로 다른 공의회였다. 에페소(431)와 칼케돈(451)의 신학적 결정 또한 각각의 지역 교회가 같은 방식으로 수용하지 않았다. 이 권의 마지막 문장은 ‘하나의 교회가 완성돼 세계에 지부를 세웠다’가 아니라 **고대부터 여러 지역에 존재한 공동체들이 교리·예배·권위를 논쟁하고 관계를 맺었다**는 것이다.\n\n**독자에게 필요한 구별:** 왕실의 수용 ≠ 모든 주민의 동일 시점 개종 / 공의회의 결정 ≠ 즉각적 전 지역 수용 / 동방 정교회 ≠ 오리엔트 정교회 ≠ 동방교회.\n\n**다음으로:** 중세에 이 교회들의 역사와 교류는 끝난 것이 아니라 다른 제국과 언어권에서 계속된다. VOL-02로 이동한다."},{"id":"VOL-02","title":"중세교회와 개혁의 배경","question":"라틴 서유럽 밖의 교회도 함께 보아야 하지 않을까?","summary":"중세는 수도원·대학과 함께 비잔틴·시리아어권·인도양·중국·아르메니아·에티오피아의 동시대 역사였다.","period":"6–15세기","body":"### VOL-02 — 중세교회 | 라틴 서유럽 밖의 교회도 함께 보아야 하지 않을까?\n\n6~15세기 기독교의 역사는 서방 수도원·교황권·대학만이 아니다. 비잔틴과 시리아어권, 페르시아와 이슬람권, 아르메니아·에티오피아, 인도양의 말라바르 공동체와 실크로드의 중국을 같은 시기 지도에 올려야 한다. 교회의 예배·문헌·지도권이 비슷한 이름을 가졌다고 같은 제도 아래 있었던 것은 아니다.\n\n중국의 781년 경교비는 **635년 도착을 회고**하는 기록물이다. 비문 건립과 그 비문이 전하는 과거의 사건을 구분한다. 인도 성 토마스 공동체의 오래된 자기 전승도 중요하지만 1세기 사도 토마스 직접 도래를 당대 자료로 확정한 역사적 사건으로 쓰지 않는다. 1054년의 동서 갈등은 장기 분화의 상징적 사건이고 1204년의 콘스탄티노폴리스 약탈은 또 다른 전환이었다.\n\n서유럽 안에서도 개혁 요구는 외부의 공격만이 아니었다. 수도원 개혁, 학교·대학, 여성과 평신도의 경건, 성직자의 행위에 대한 비판이 있었다. **중세는 16세기 종교개혁을 기다리며 멈춰 있던 공백기가 아니었다.**\n\n**다음으로:** 중세 말의 여러 개혁은 하나의 직선적 선구자 계보가 아니었으며 VOL-03에서 각자 다른 의도를 살펴본다."},{"id":"VOL-03","title":"다양한 중세 개혁 운동","question":"위클리프·후스·왈도파는 같은 운동인가?","summary":"리옹·옥스퍼드·프라하의 개혁은 한 조직·교리가 아니며, 위클리프와 후스의 성찬관 차이와 후스파 내부 갈등을 구분한다.","period":"12–16세기 초","body":"### VOL-03 — 선행 개혁과 다양한 중세 운동 | 위클리프·후스·왈도파는 같은 운동인가?\n\n12세기 리옹의 발도와 왈도파는 청빈과 평신도 설교의 권한을 물었다. 14세기의 위클리프는 성경·교회 권위·성찬에 관해 영국의 대학과 교회를 향해 질문했다. 15세기 보헤미아의 후스와 그를 이은 집단들은 설교·교회 통치·예배·정치적 자율성과 관련한 갈등 속에 놓였다. 이들은 모두 ‘개혁’이라는 말을 공유할 수 있지만 하나의 조직이나 동일 교리를 가진 세대별 분파는 아니다.\n\n후스가 위클리프의 저술에 영향을 받았다고 해서 성찬에 대한 이해까지 같지는 않았다. 성찬에서 빵의 실체가 남는다고 본 위클리프와 실체변화를 수용한 후스의 차이는 그 좋은 사례다. 후스 사후에는 여러 후스파 집단 사이에서도 정치와 예배의 선택이 달라졌다. 프라하 4개조의 문안·공적 채택, 바젤에서의 교섭, 이흘라바에서의 합의 공포는 서로 다른 역사 단계다.\n\n**이 권의 편집 원칙:** ‘발도→위클리프→후스→루터’라는 단선의 자동 계승 화살표를 그리지 않는다. 간접 영향·문헌 수용·후대 재해석·직접 대면을 구별한다.\n\n**다음으로:** 16세기의 개혁은 지역별 정치·인쇄·신학의 선택과 만나 서로 다른 결과로 나타났다. VOL-04로 이동한다."},{"id":"VOL-04","title":"16세기 여러 종교개혁","question":"왜 유럽 각 지역에서 개혁의 결과가 달랐는가?","summary":"독일·스위스·프랑스·저지대·영국·스코틀랜드·북유럽·동유럽의 개혁은 동일한 정치적 결정이나 성찬관으로 환원되지 않는다.","period":"16세기","body":"### VOL-04 — 16세기 여러 종교개혁 | 독일에서 시작된 변화는 왜 유럽 각 지역에서 달라졌는가?\n\n루터의 1517년 면벌부 논쟁은 중대한 전환이지만, 독일 모든 영방이 곧바로 하나의 교회가 된 것은 아니다. 취리히의 츠빙글리와 제네바의 개혁파, 여러 재세례파 공동체, 영국·스코틀랜드·아일랜드의 정치와 예배, 프랑스의 소수 개혁파, 저지대의 반란, 북유럽의 군주 주도 개혁, 보헤미아와 중앙·동유럽의 다종교 질서는 동시대의 서로 다른 역사였다. 기존 V4.07은 이 구조를 **유럽 11개 지역**으로, V4.08은 **45개 사건·8개 비교 장면**으로 정리했다.\n\n1529년 마르부르크의 성찬 논쟁처럼 서로 성경을 중시해도 신학적으로 합의하지 못한 문제가 있었다. 1530년 아우크스부르크 신앙고백의 제출, 1531년 주요 초기 인쇄판, 1540년 Variata는 다른 문헌 사건이다. 칼뱅의 1536년 『기독교강요』 초판과 1559년 최종 라틴어판도 같은 문서의 완전 동일한 상태로 취급할 수 없다.\n\n**11개 지역 동시대 지도에 적용할 규칙:** 같은 연도에 사건이 일어남 ≠ 직접 교류·영향 / 현대 국경 ≠ 당시 정치적 통치권 / 군주의 법률 변화 ≠ 주민 모두의 동일 신앙.\n\n**다음으로:** 개신교 교회들의 제도화와 함께 가톨릭 내부에서도 개혁이 진행되었고 종교적 갈등과 공존이 새로운 법질서를 만들었다. VOL-05로 이동한다."},{"id":"VOL-05","title":"가톨릭 개혁·갈등·공존","question":"바뀐 것은 교리뿐이었나, 사람들의 삶이었나?","summary":"가톨릭 내부 쇄신, 트리엔트 공의회·수도회·여성의 영성, 검열·전쟁·제한적 공존을 함께 읽는다.","period":"16–17세기","body":"### VOL-05 — 가톨릭 개혁·갈등·공존 | 바뀐 것은 교리뿐이었나, 사람들의 삶이었나?\n\n가톨릭 개혁을 개신교에 대한 단순 반작용만으로 설명하면 중세부터 이어진 수도회·성직 교육·예배와 영성의 쇄신을 잃게 된다. 트리엔트 공의회는 **1545~1547, 1551~1552, 1562~1563년**의 세 시기로 열렸고 교리·성례·성직 규율을 논의했다. 1547년 칭의 교령도 이 맥락에 포함된다. 예수회와 가르멜회 개혁, 교육과 여성의 종교생활은 교회제도의 안쪽에서 일어난 변화를 보여준다.\n\n그러나 개혁과 단련이 언제나 자유의 확장을 뜻하지는 않았다. 종교재판·검열, 전쟁과 추방은 가톨릭 지역뿐 아니라 여러 개신교 정치체제에서도 일어났다. 1555년 아우크스부르크 화의는 일부 영방과 특정 신앙고백을 대상으로 한 법적 타협이었다. 일부 주민에게 제한적인 이주권이 있었지만 모두에게 현대적 의미의 개인 종교 자유를 준 것은 아니다. 1648년의 베스트팔렌은 다시 다른 법적 지위를 조정했다.\n\n**이 권의 역사적 긴장:** 신앙의 진정성을 추구한 제도와 공존을 제한한 권력은 하나의 시대 안에서 함께 있었다. 어느 한 교파를 자유·억압의 절대적 대명사로 만드는 서술을 피한다.\n\n**다음으로:** 신앙고백의 제도화 후에도 개인과 공동체의 삶을 변화시키려는 질문은 남았다. VOL-06으로 이어진다."},{"id":"VOL-06","title":"경건주의·부흥·세계선교","question":"신앙의 변화는 어떻게 일상의 언어가 되었나?","summary":"슈페너·할레·모라비아·웨일스/영미 부흥·현지인 선교협력을 연결하되 식민질서·교육·번역의 복잡성을 보존한다.","period":"17–19세기","body":"### VOL-06 — 경건주의·부흥·세계선교 | 신앙의 변화는 어떻게 일상의 언어가 되었나?\n\n슈페너가 1675년에 펴낸 『경건한 열망』은 교회 안의 성경 읽기, 평신도 참여와 생활의 변화를 제기했다. 할레의 프랑케와 교육·돌봄 사업, 모라비아 공동체와 서로 다른 영국·북미 부흥, 감리교와 여성·흑인 공동체, 근대 해외 선교의 인쇄·의료·교육까지 **여덟 갈래**의 연결 역사가 있다. 이를 ‘모든 신앙이 한 방향으로 더욱 순수해졌다’는 도식으로 읽지 않는다.\n\n1706년 치겐발크의 남인도 도착과 현지 타밀어 협력, 1714년 복음서·사도행전 인쇄, 1715년 신약전서 전체가 갖춰지는 과정은 도착·번역·인쇄가 서로 다른 사건임을 보여 준다. 선교사만이 아니라 언어를 가르친 사람, 인쇄·독서·학교를 만든 현지인도 역사적 주체였다. 해외선교와 제국주의의 관계는 어느 곳에서나 동일하지 않았으며 협력·강압·저항이 함께 존재했다.\n\n**편집 경계:** 한 지역의 부흥을 다른 지역의 부흥과 이름만으로 동일시하지 않는다. 선교 활동의 수·확장만을 성공 지표로 쓰지 않으며 여성·노예화된 사람들·현지 지도자의 활동과 비판을 함께 기록한다.\n\n**다음으로:** 이 연결이 실제 지역 역사에서 어떤 선택과 충돌을 만들었는지 VOL-07에서 살펴본다."},{"id":"VOL-07","title":"세계와 한국 교회사","question":"수용한 사람들은 무엇을 새로 만들었는가?","summary":"아프리카·아시아·아메리카·태평양·한국의 주체적 선택을 중심으로 서술하고 고대 전개는 제1·2권과 연결한다.","period":"고대 선례와 18–20세기 중심","body":"### VOL-07 — 세계와 한국 교회사 | 수용한 사람들은 무엇을 새로 만들었는가?\n\n교회사가 ‘유럽에서 전해지고 다른 지역이 받아들였다’는 한 방향의 이야기라면 4세기 악숨, 중세 인도양과 중국, 콩고 왕실, 아프리카 독립교회, 아메리카의 흑인 공동체, 오세아니아 섬 주민, 중국과 일본의 현지 기독교, 그리고 한국의 독특한 시작을 설명하기 어렵다. 이 권은 이미 존재했던 아프리카·아시아 교회를 **그들 시대의 독립된 역사**로 존중하면서 이후 선교와 식민지배·교육·박해·사회 변화까지 읽는다.\n\n한국의 천주교 공동체는 18세기 후반 서학을 연구한 한국인들 사이에서 형성됐다. 1784년 이승훈의 세례·귀국은 중요한 분기점이지만 1779년 학문 모임의 신앙 공동체 여부는 해석이 갈린다. 개신교 역사는 또 다른 경로다. 로스·매킨타이어와 한국인 번역·전도 협력자, 1880년대 선교사 입국, 1907년 부흥과 이후 사회적 실천을 구분해야 한다. 1882년 개별 한글 복음서, 1887년 신약전서, **1911년 개신교의 신·구약 성경전서**는 서로 다른 책이다.\n\n**권 중복 관리:** VOL-01·02에 있는 아프리카·아시아 고대사를 VOL-07에 다시 통째로 복제하지 않는다. 제7권은 현지인이 어떻게 신앙을 재해석하고 언어·제도·사회와 연결했는가를 중심에 두고 고대·중세는 해당 권으로 연결한다.\n\n**다음으로:** 이런 역사를 시대순으로 다시 외울 필요 없이 하나의 질문으로 비교하고 싶다면 VOL-08을 사용한다."},{"id":"VOL-08","title":"여섯 주제와 문헌 아카이브","question":"서로 다른 시대를 무엇으로 비교할까?","summary":"성경과 권위·은총과 구원·성찬과 예배·교회조직·국가와 갈등·번역을 7개 역사권에 나란히 연결한다.","period":"모든 시대 가로지름","body":"### VOL-08 — 여섯 주제·문헌 아카이브 | 서로 다른 시대를 무엇으로 비교할까?\n\n제8권은 여덟 번째 연대기가 아니다. 새 인물과 사건을 반복 등록하는 대신 제1~7권의 사례를 **여섯 질문**으로 가로질러 찾는 자료실이다. 예를 들어 ‘성경의 권위’는 니케아의 공의회, 위클리프의 교회론, 루터파의 신앙고백, 한국어 번역에서 같은 역사적 의미를 갖지 않는다. ‘종교 자유’ 역시 1555년의 제국법과 현대의 개인 권리를 같은 뜻으로 해석할 수 없다.\n\n등록된 여섯 질문은 다음과 같다. **성경과 권위 / 은총과 구원 / 성찬과 예배 / 교회조직과 일상생활 / 국가·갈등·공존 / 번역과 지역 수용.** 각 질문은 제1~7권에 한 개씩 대표 탐색 앵커를 두어 **총 42개 연결**로 구성된다. 이 링크가 역사적 증거의 완전성을 말해 주지는 않는다. 문헌 아카이브에는 원저작의 역사, 필사본·판본, 현대 번역, 학술 해석의 층위를 표시하고 직접 인과·유사성·후대 수용을 구분한다.\n\n**독자의 출구:** 한 질문 선택 → 시대별 대표 장면 비교 → 각 권의 상위 원고 → 확인한 출처와 그 접근 수준으로 이동. 실제 클릭 가능한 URL과 도서관 권리 조건은 앱 스테이징·법적 심사 전까지 생성된 것으로 주장하지 않는다."}],"themes":[{"id":"T415-01","title":"성경과 권위","question":"성경·공의회·주교·지역 공동체는 누가 무엇을 근거로 가르치는지를 어떻게 결정했는가?","body":"## 주제 1. 성경과 권위 — 누가 무엇을 근거로 가르치는가?\n\n**핵심 질문:** 한 공동체가 성경을 해석할 때 교회의 가르침, 공의회, 전승, 지도자의 직무, 국가의 권한은 서로 어떤 관계에 놓이는가?\n\n**고대의 문제(VOL-01).** 교회는 성경 해석과 신앙고백의 언어를 형성하며 논쟁했다. 325년 니케아·381년 콘스탄티노폴리스·451년 칼케돈 등의 결정은 권위 있는 가르침의 중요한 사례였지만 결정의 발표와 각 지역의 수용은 같지 않았다. 알렉산드리아·시리아 등 공동체의 다른 반응을 지역사와 함께 읽어야 한다. (ARC413-04)\n\n**중세의 문제(VOL-02).** 교황권·공의회·수도회·대학·지역 교회의 권위가 서로 조정되고 갈등했다. 1054년과 1204년을 통한 동서 관계는 ‘하나의 날에 세계교회가 완전히 분열’했다는 도식보다 장기적인 권위·정치·예배의 차이를 잘 보여 준다. (ARC413-12, ARC413-13)\n\n**선행 개혁의 문제(VOL-03).** 위클리프는 교회 권력·성경·참된 교회의 관계를 물었다. 후스는 위클리프를 부분적으로 수용했으나 그의 모든 견해를 반복한 것은 아니었다. 왈도파의 평신도 설교 문제는 **누가 허락하고 가르칠 수 있는가**라는 다른 질문을 드러낸다. (A414-02, A414-03, A414-05)\n\n**16세기 개혁의 문제(VOL-04).** 루터의 논쟁은 성경·교황·공의회의 관계로 발전했고, 아우크스부르크 신앙고백은 특정 영방과 도시의 신학적 공적 표명을 구성했다. 스위스 도시·재세례파·잉글랜드 왕권의 변화는 ‘성경의 권위를 강조했다’는 공통 문장만으로 같아지지 않는다. (E408-04, E408-06, E408-12)\n\n**가톨릭 쇄신(VOL-05).** 트리엔트 공의회는 교리와 제도 개혁의 두 영역에 개입했다. 가톨릭 개혁을 ‘성경을 거부한 반작용’으로 묘사하지 않고 성경·전승·교회 교도권의 관계를 당대의 자기 설명으로 소개한다. (A409-02)\n\n**경건주의와 세계 교회(VOL-06~07).** 경건주의는 성경을 읽는 평신도 소모임과 교회 생활을 강조했다. 19세기 번역·교육과 지역 교회 조직은 권위의 문제가 새로운 언어와 지도력으로 옮겨 갔음을 보여 주지만, 모든 지역의 공동체가 유럽의 하나의 교권을 동일하게 받아들였다는 뜻은 아니다. (ARC412-01, A410-08)\n\n**독자의 결론:** “성경의 권위”가 동일한 말을 사용했다는 이유만으로 각 시대의 교회 정치와 신학을 동일시하지 않는다. 문서의 작성자·수용 공동체·권위가 작동한 사회적 범위를 함께 확인한다.","anchors":[{"volume_id":"VOL-01","title":"공의회 결의와 다양한 지역의 수용","ref":"ARC413-04","role":"CORE_CASE"},{"volume_id":"VOL-02","title":"1054년과 1204년을 통한 동서 관계","ref":"ARC413-12","role":"CORE_CASE"},{"volume_id":"VOL-03","title":"위클리프: 성경·교회 권위·성찬","ref":"A414-03","role":"CORE_CASE"},{"volume_id":"VOL-04","title":"보름스 제국회의와 루터 문제","ref":"E408-04","role":"CORE_CASE"},{"volume_id":"VOL-05","title":"트리엔트 공의회: 신학적 정의와 제도 개혁","ref":"A409-02","role":"CORE_CASE"},{"volume_id":"VOL-06","title":"신앙고백 이후의 질문: 경건주의는 무엇을 바꾸려 했나","ref":"ARC412-01","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-07","title":"한국 개신교: 번역·회중·교육·부흥과 사회","ref":"A410-08","role":"CONTEXT_BRIDGE"}]},{"id":"T415-02","title":"은총과 구원","question":"은총·믿음·성례·행위·성화·회심을 각각의 전통은 어떻게 연결했는가?","body":"## 주제 2. 은총과 구원 — 누가, 무엇으로, 어떻게 의롭게 되는가?\n\n**핵심 질문:** 하나님의 은총·그리스도·믿음·성례·행위·교회생활의 관계를 각 시대와 교단은 어떻게 설명했는가?\n\n**고대에서 중세로(VOL-01~02).** 북아프리카의 아우구스티누스는 죄와 은총, 인간의 의지와 하나님의 도움을 깊이 논의했고 후대 서방 신학의 중요한 참고점이 됐다. 그러나 이 사실이 아우구스티누스가 16세기 루터파 신앙고백을 그대로 가르쳤다는 뜻은 아니다. 중세의 수도원과 대학 신학에는 다양한 은총·덕·성례 이해가 있었고, 하나의 ‘중세 가톨릭 주장’으로 평탄화할 수 없다. (ARC413-02, ARC413-13)\n\n**종교개혁 이전(VOL-03).** 위클리프·후스·왈도파는 교회 권위·신앙 실천을 논했으나 그 모두에게 이후 정식화된 ‘이신칭의’를 동일 문안으로 소급할 수 없다. 선구자라는 이름으로 후대 교리를 먼저 완성한 인물로 꾸미지 않는다. (A414-01, A414-03, A414-05)\n\n**16세기 논쟁(VOL-04).** 루터와 멜란히톤의 칭의 이해, 개혁파의 은총과 예정 논의, 재세례파의 제자도와 공동체 실천은 서로 교류하면서도 다른 초점을 가졌다. **1530년 아우크스부르크에서 제출된 신앙고백**, **1531년 라틴어 출판본** 및 **1540년의 이른바 Variata**는 서로 다른 문서·판본 사건으로 구별한다. 개별 조항의 정확한 문구 비교는 L2로 연결한다. (E408-12)\n\n**가톨릭의 대응과 내부 쇄신(VOL-05).** 트리엔트 공의회의 칭의 관련 가르침은 루터파 문헌과 공통의 주제를 다른 방식으로 정의한다. 가톨릭이 ‘인간 노력만으로 구원받는다’고 단순화하는 것도, 종교개혁자들이 모든 선행의 의미를 폐지했다고 설명하는 것도 왜곡이다. 논쟁은 은총과 인간의 응답, 성례·교회생활을 어떻게 설명할지에 관한 여러 차이를 포함했다. (A409-02)\n\n**근현대의 다른 질문(VOL-06~07).** 영국·웨일스 부흥과 감리교·대각성의 회심·성화·경건 문제는 16세기의 칭의 논쟁과 연결되지만 동일한 사건은 아니다. 세계 각 지역에서 구원과 공동체생활을 어떻게 설명했는지는 지역의 신학·역사를 독립적으로 읽어야 한다. 웨슬리계와 웨일스 칼뱅주의 감리교를 ‘감리교’라는 표기만으로 하나로 묶지 않는다. (ARC412-04, ARC412-05, A410-09)\n\n**독자의 결론:** ‘은총’, ‘칭의’, ‘성화’, ‘회심’이라는 단어를 등장 시기와 논쟁에 따라 구별한다. 서로 다르다는 평가 자체를 도덕적 우열 판단으로 바꾸지 않는다.","anchors":[{"volume_id":"VOL-01","title":"이집트·북아프리카의 신학과 수도생활","ref":"ARC413-02","role":"CORE_CASE"},{"volume_id":"VOL-02","title":"서방 수도원·대학·교황권·개혁 요구","ref":"ARC413-13","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-03","title":"후스: 보헤미아의 개혁과 위클리프 비판적 수용","ref":"A414-05","role":"LIMITED_CONTEXT_NOT_DOCTRINE"},{"volume_id":"VOL-04","title":"아우크스부르크 신앙고백 제출","ref":"E408-12","role":"CORE_CASE"},{"volume_id":"VOL-05","title":"트리엔트 공의회: 신학적 정의와 제도 개혁","ref":"A409-02","role":"CORE_CASE"},{"volume_id":"VOL-06","title":"웨일스·잉글랜드·북미: 하나가 아니었던 여러 부흥","ref":"ARC412-04","role":"CORE_CASE"},{"volume_id":"VOL-07","title":"세계 기독교는 여러 중심으로 다시 연결된다","ref":"A410-09","role":"CONTEXT_BRIDGE"}]},{"id":"T415-03","title":"성찬과 예배","question":"성찬의 실제 임재·기념·영적 참여와 평신도 참여를 서로 어떻게 구별할 것인가?","body":"## 주제 3. 성찬과 예배 — 같은 빵과 잔을 어떻게 이해했는가?\n\n**핵심 질문:** 성찬에서 그리스도의 임재를 어떻게 이해하며, 누가 어떤 형태로 성찬에 참여하고 예배를 인도하는가?\n\n**초기 공동체와 중세 예배(VOL-01~02).** 예배와 성찬은 초기 공동체의 삶의 일부였고, 그 의미와 예식은 지역과 시기에 따라 다양한 방식으로 체계화됐다. 12세기 이후 라틴 서방에서 발전한 실체변화 교리의 문안과 고대 교부의 용어를 동시대 문헌으로 혼동하지 않는다. 비잔틴·아르메니아·에티오피아의 전례와 라틴 미사의 차이를 ‘미개/발전’의 단계로 배치하지 않는다. (ARC413-01, ARC413-07, ARC413-08)\n\n**위클리프·후스·후스파(VOL-03).** 위클리프는 실체변화 교리를 비판하며 성찬 후에도 빵의 실체가 남는 견해를 발전시켰으나, 후스는 실체변화를 수용했다. 1414년 무렵의 양형 영성체 논쟁과 1420년 전후 프라하 4개조는 평신도의 성찬 참여를 둘러싼 별도 문제다. **양형 영성체를 곧 성찬의 상징설로 번역하지 않는다.** (A414-03, A414-05, A414-06)\n\n**루터·츠빙글리·칼뱅(VOL-04).** 1529년 마르부르크 회담은 성찬에 관한 실질적인 이견을 드러냈다. 루터의 실제 임재 강조, 츠빙글리의 기념·신앙 공동체적 강조, 칼뱅의 성령을 통한 그리스도와의 참여를 단순히 ‘가톨릭=실제, 개신교=상징’으로 분할하면 핵심이 사라진다. 칼뱅의 1536년과 1559년 『기독교강요』 사이의 구성·본문 변화도 후대 독서의 맥락이다. 해당 판본의 조항 대조는 L2 자료로 남긴다. (E408-11)\n\n**트리엔트 이후의 가톨릭 및 부흥기(VOL-05~06).** 가톨릭의 성찬 교리와 예전 개혁은 트리엔트와 그 이후 실천을 구별해야 한다. 감리교 및 부흥운동의 예배·찬송·설교·소모임은 성찬의 교리만이 아니라 공동체의 전체 생활을 보여 준다. 그러나 예배 형식의 유사성만으로 같은 성찬 신학을 추론하지 않는다. (A409-02, A409-03, ARC412-04)\n\n**세계·한국 교회(VOL-07).** 식민주의·현지 언어·독립교회의 형성은 예배 방식에도 영향을 주었다. 한국 천주교·개신교가 서로 다른 성찬·예배 전통을 지녔음을 구별하고, 특정 선교사가 전해 준 전례가 세계의 표준이라고 서술하지 않는다. (A410-07, A410-08, A410-09)\n\n**독자의 결론:** *실체변화 / 실제 임재 / 영적 참여 / 기념*이라는 표현은 각 인물과 문헌 맥락에서 해설한다. 예배가 비슷하다는 사실과 교리의 동의를 섞지 않는다.","anchors":[{"volume_id":"VOL-01","title":"지중해와 시리아의 여러 지역 공동체","ref":"ARC413-01","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-02","title":"비잔틴·페르시아·이슬람권의 교회","ref":"ARC413-07","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-03","title":"프라하 4개조와 양형 영성체","ref":"A414-06","role":"CORE_CASE"},{"volume_id":"VOL-04","title":"마르부르크 회담과 성찬 이해의 차이","ref":"E408-11","role":"CORE_CASE"},{"volume_id":"VOL-05","title":"트리엔트 공의회: 신학적 정의와 제도 개혁","ref":"A409-02","role":"CORE_CASE"},{"volume_id":"VOL-06","title":"웨일스·잉글랜드·북미: 하나가 아니었던 여러 부흥","ref":"ARC412-04","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-07","title":"세계 기독교는 여러 중심으로 다시 연결된다","ref":"A410-09","role":"CONTEXT_BRIDGE"}]},{"id":"T415-04","title":"교회조직과 생활","question":"교회의 지도자·평신도·여성·수도자·지역 신자들은 공동체를 어떻게 조직했는가?","body":"## 주제 4. 교회조직과 일상생활 — 누가 신앙공동체를 이루고 돌보는가?\n\n**핵심 질문:** 주교·장로·성직자·평신도·여성·수도공동체·독립교회와 같은 다양한 조직은 어떤 필요와 권위 속에서 형성됐는가?\n\n**고대 교회(VOL-01).** 초기 교회에서는 여러 도시의 공동체가 설교·돌봄·성경 해석과 직무를 발전시켰다. 2세기의 지역 지도력을 중세 교황제나 현대 교단 조직과 완전히 같은 제도로 소급하지 않는다. 알렉산드리아·히포·아르메니아·악숨의 지역성을 함께 보아야 한다. (ARC413-01, ARC413-02, ARC413-03)\n\n**중세 교회(VOL-02).** 유럽의 수도원·대학뿐 아니라 에티오피아·아르메니아·시리아어권의 필사 공동체가 예배·교육·지식과 돌봄을 조직했다. 남인도 말라바르의 공동체 역시 근세 서구 선교단체보다 앞선 역사다. (ARC413-08, ARC413-10, ARC413-11)\n\n**중세 후기 개혁(VOL-03).** 왈도파의 평신도 설교, 데보티오 모데르나의 공동생활, 후스파의 공동체와 형제단의 형성은 개혁이 단순히 교리를 비판하는 일이 아니라 **누가 함께 살고 조직을 유지할 것인가**를 묻는 역사임을 보여 준다. 이 모든 운동이 현대적 평등을 구현했다고 해석하지 않는다. (A414-01, A414-02, A414-09)\n\n**여러 16세기 교회 형태(VOL-04).** 영방교회·시의회와 연결된 개혁, 개혁파 장로제의 발전, 잉글랜드의 왕권과 주교제, 재세례파 공동체의 자치·성인 신앙고백 강조는 서로 다른 제도적 선택이었다. 16세기의 제도 모습을 현재 각 교단과 바로 일치시키지 않는다. (E408-06, E408-14)\n\n**가톨릭·경건주의·세계 교회(VOL-05~07).** 가톨릭 수도회와 여성 영성가, 프랑케의 학교와 모라비아 공동체, 웨슬리계 모임, 자레나 리와 흑인 교회의 지도력, 아프리카·태평양·한국 신자의 교육·교회 조직은 모두 누가 교회를 만드는가를 다시 물었다. 구호와 교육에는 돌봄뿐 아니라 훈육·권력·식민주의의 긴장도 있었다. 여성의 공적 신앙 활동을 곧 모든 교단에서 동일한 성직 권한의 획득으로 설명하지 않는다. (A409-03, ARC412-02, ARC412-05, A410-03, A410-08)\n\n**독자의 결론:** 신학적 경건과 실제 교회의 운영을 연결하되 각 공동체의 성별·계층·인종 및 정치적 권력관계를 지우지 않는다.","anchors":[{"volume_id":"VOL-01","title":"지중해와 시리아의 여러 지역 공동체","ref":"ARC413-01","role":"CORE_CASE"},{"volume_id":"VOL-02","title":"지역 문자·수도원·필사본 문화","ref":"ARC413-08","role":"CORE_CASE"},{"volume_id":"VOL-03","title":"다수의 중세 쇄신: 데보티오 모데르나와 교회 내부 개혁","ref":"A414-01","role":"CORE_CASE"},{"volume_id":"VOL-04","title":"취리히 주변 재세례파 공동체 형성","ref":"E408-06","role":"CORE_CASE"},{"volume_id":"VOL-05","title":"수도회·영성·교육과 여성의 행위성","ref":"A409-03","role":"CORE_CASE"},{"volume_id":"VOL-06","title":"부흥은 누구의 사회를 바꾸었나: 감리교·흑인교회·여성","ref":"ARC412-05","role":"CORE_CASE"},{"volume_id":"VOL-07","title":"한국 개신교: 번역·회중·교육·부흥과 사회","ref":"A410-08","role":"CORE_CASE"}]},{"id":"T415-05","title":"국가·갈등·공존","question":"국가 정책과 교회 권력이 결합할 때 누구의 선택을 보장하거나 제한했는가?","body":"## 주제 5. 국가·갈등·공존 — 신앙은 권력과 어떻게 얽혔는가?\n\n**핵심 질문:** 신앙의 확신이 법과 정치에 들어갈 때 누구의 권리가 보호되고 누구의 선택은 제한됐는가?\n\n**제국과 교회(VOL-01~02).** 로마제국의 관용정책·공의회와 왕실의 신앙 수용은 교회가 정치권력과 만나는 사건이다. 그러나 313년 관용을 모든 주민의 즉각적인 기독교화로, 악숨 왕실의 수용을 모든 지역의 동일한 변화로 취급하지 않는다. 1054년은 동서 관계의 장기 분화를 상징하는 한 시점이며, 1204년 제4차 십자군의 약탈을 별도 사건으로 읽어야 한다. (ARC413-05, ARC413-12)\n\n**선행 개혁의 갈등(VOL-03).** 콘스탄츠에서의 후스 재판과 처형, 후스파 전쟁, 바젤과의 협상, 리파니 전투와 이흘라바의 합의는 정치와 교회의 요구가 혼합된 과정이다. **프라하 4개조(요구), 1433년 협상, 1434년 전쟁, 1436년 공적 공포**를 하나의 법령 또는 평화조약으로 합치지 않는다. (A414-05, A414-07, A414-08)\n\n**16세기 유럽의 다른 정치질서(VOL-04).** 독일 영방의 보호와 제국회의, 취리히 도시의회, 잉글랜드 국왕의 수장령, 보헤미아·헝가리·북유럽의 종교정책은 제각기 다른 국가·도시·교회 권위 구조를 형성했다. 일부 재세례파와 소수집단은 가톨릭과 개신교 제도 모두에서 박해를 경험했다. (E408-05, E408-06, E408-14)\n\n**제한된 공존과 갈등(VOL-05).** 1555년 아우크스부르크 화의는 신성로마제국의 특정 영방·신앙고백에 관련된 정치·법적 합의다. **현대의 개인별 보편적 종교 자유를 선언한 문서가 아니다.** 프랑스 종교전쟁과 낭트 칙령, 폴란드-리투아니아의 공존 시도, 1648년 베스트팔렌 조약은 서로 다른 법적 범위와 한계를 가진다. (A409-04, A409-05)\n\n**식민권력과 현지인(VOL-06~07).** 모라비아 선교와 카리브해 노예제, 러시아 정교회의 알래스카 선교와 모피무역, 가톨릭·개신교의 다른 해외 관계, 현지인의 저항·교섭·자치가 함께 존재했다. 식민주의와 선교가 언제나 완전히 일치하거나 완전히 분리되었다고 미리 판단하지 않는다. 한국의 박해·식민지 시기·분단 역시 독자적인 정치사회사 속에서 설명한다. (ARC412-03, ARC412-07, A410-04, A410-07, A410-08)\n\n**독자의 결론:** 법률 문서는 당시 보호한 사람들의 구체적 범주를 함께 표시한다. 국가가 특정 교리를 허용했다는 사실에서 해당 영토의 모든 개인이 자유롭게 선택했다는 결론을 도출하지 않는다.","anchors":[{"volume_id":"VOL-01","title":"제국 정치와 지역 교회 삶의 다른 시간표","ref":"ARC413-05","role":"CORE_CASE"},{"volume_id":"VOL-02","title":"1054년과 1204년을 통한 동서 관계","ref":"ARC413-12","role":"CORE_CASE"},{"volume_id":"VOL-03","title":"바젤 콤팍타타: 협상·전투·공포","ref":"A414-08","role":"CORE_CASE"},{"volume_id":"VOL-04","title":"잉글랜드 수장령과 로마와의 법적 결별","ref":"E408-14","role":"CORE_CASE"},{"volume_id":"VOL-05","title":"화의와 관용의 한계","ref":"A409-05","role":"CORE_CASE"},{"volume_id":"VOL-06","title":"가톨릭·동방정교의 별도 역사: 예수회와 알래스카","ref":"ARC412-07","role":"CORE_CASE"},{"volume_id":"VOL-07","title":"아메리카의 식민주의와 현지인의 새로운 기독교","ref":"A410-04","role":"CORE_CASE"}]},{"id":"T415-06","title":"번역과 지역 수용","question":"누가 어떤 언어로 번역·교육·유통하고 지역의 신앙과 공동체를 재구성했는가?","body":"## 주제 6. 번역과 지역 수용 — 누구의 언어로 신앙이 살아남는가?\n\n**핵심 질문:** 신앙을 다른 언어로 옮기는 과정에서 번역가·필사자·교사·여성과 현지 지도자들은 어떤 선택을 했으며, 누가 기록에서 사라졌는가?\n\n**고대 세계(VOL-01).** 그리스어·라틴어·시리아어와 북아프리카·코카서스의 언어 환경은 성경 해석의 중요한 조건이었다. 같은 본문이 여러 언어에서 읽혔다고 각 공동체의 제도와 교리가 동일한 것은 아니다. (ARC413-01, ARC413-03)\n\n**중세 동서 교류(VOL-02).** 아르메니아의 문자·번역과 에티오피아의 기즈어 문헌, 시리아어 교회, 남인도의 전통, 당나라 중국의 경교비는 세계 기독교가 근대 유럽 선교사 이전에도 다언어·다지역이었다는 증거다. **781년에 세워진 비문이 635년을 회고**한다는 두 날짜의 자료 위계는 유지한다. (ARC413-08, ARC413-09, ARC413-10)\n\n**유럽의 민중어 성경(VOL-03~04).** 위클리프와 연결된 중세 영어 성경 번역은 여러 사람의 필사·개정·사용을 통해 확산됐다. 16세기 인쇄술과 루터 시대의 독일어 성경, 북유럽의 왕권·교회 개혁과 잉글랜드의 민중어 예배 역시 단일한 방향의 언어혁명은 아니다. 누가 번역했는지와 누가 제작·유통하고 이용했는지를 구분한다. (A414-04, E408-02, E408-16)\n\n**가톨릭의 선교·교육(VOL-05).** 예수회와 다른 가톨릭 공동체의 해외 활동은 현지 지식인과 지리·언어·천문·신학을 교류했다. 그 협력이 항상 평등했다고 보거나 현지인이 수동적 피교육자였다고 표현하지 않는다. (A409-06)\n\n**경건주의·근대 선교의 번역망(VOL-06).** 할레–트랑케바르의 타밀어 교육·번역, 세람포르의 인도인 언어학자 및 인쇄 작업, 서아프리카의 사무엘 아자이 크라우더, 태평양 섬 주민 사역은 유럽인이 혼자 각 지역 언어를 만든 것이 아니라는 사실을 보여 준다. (ARC412-02, ARC412-06, ARC412-08)\n\n**한국과 근현대 세계교회(VOL-07).** 조선의 18세기 서학 수용과 천주교 공동체 형성은 1880년대 개신교 번역보다 앞선 **다른 출발**이다. 1882년 한글 복음서와 1887년 『예수셩교젼셔』, 일본·만주에서의 번역 협력, 1907년 평양 부흥과 1919년 독립운동의 관계를 사료와 시기로 구별한다. 한국인 번역·유통·회중의 주체성을 외국인 선교사 전기의 부록으로 다루지 않는다. (A410-07, A410-08)\n\n**독자의 결론:** 번역의 역사에는 본문뿐 아니라 말의 선택, 구전·인쇄·유통, 학교·가정·현지 신자의 행동이 포함된다. '첫 번역'과 '첫 신앙 공동체'는 동일한 날짜가 아닐 수 있다.","anchors":[{"volume_id":"VOL-01","title":"아르메니아·악숨의 왕실 수용과 주민 공동체","ref":"ARC413-03","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-02","title":"781년 경교비와 635년의 후대 회고","ref":"ARC413-09","role":"CORE_CASE"},{"volume_id":"VOL-03","title":"롤라드와 중세 영어 성경 필사본","ref":"A414-04","role":"CORE_CASE"},{"volume_id":"VOL-04","title":"덴마크 크리스티안 3세의 개혁과 왕권 재편","ref":"E408-16","role":"CONTEXT_BRIDGE"},{"volume_id":"VOL-05","title":"유럽 너머의 연결: 선교와 현지 공동체","ref":"A409-06","role":"CORE_CASE"},{"volume_id":"VOL-06","title":"경건을 교육과 번역으로: 할레와 남인도의 연결","ref":"ARC412-02","role":"CORE_CASE"},{"volume_id":"VOL-07","title":"한국 개신교: 번역·회중·교육·부흥과 사회","ref":"A410-08","role":"CORE_CASE"}]}],"reader":{"title":"여덟 권을 잇는 하나의 역사","target_minutes":10,"preface":"# 종교개혁 ATLAS — 여덟 권을 잇는 하나의 역사\n\n\u003e V4.21 · 비공개 독해 평가용 교정본 · 역사 자료 재대조 완료(일부 검토 보류) · 외부 전문가 승인 및 실제 독자 평가 전\n\u003e\n\u003e 읽기 안내: 이 글은 약 10분 읽기를 목표로 구성했습니다. 시간은 아직 측정되지 않았습니다. 이해하기 어려운 표현이 있으면 표시해 두고, 글을 다 읽은 후 제공받는 질문에 답해 주세요.","scenes":[{"id":"INTRO-1","heading":"1. 종교개혁 이전에도 교회는 세계 여러 곳에 있었습니다","body":"## 1. 종교개혁 이전에도 교회는 세계 여러 곳에 있었습니다\n\n1517년 루터의 이름을 들으면 종교개혁이 시작된 장면이 떠오를 것입니다. 그러나 그것이 곧 기독교 전체의 시작은 아닙니다. 지중해 동쪽과 북아프리카, 서아시아에는 이미 오랜 기독교 공동체가 있었습니다. 아프리카의 악숨 왕국에서는 4세기에 왕실이 기독교를 수용했습니다. 그렇다고 그 땅의 모든 주민이 같은 시기에 같은 방식으로 신앙을 받아들였다는 뜻은 아닙니다.\n\n오랜 세월 동안 교회는 사회와 언어에 따라 다양한 모습을 가졌습니다. 사람들이 묻는 질문에도 공통점과 차이가 있었습니다. 누가 성경을 해석할 권한을 갖는지, 신앙을 실천할 때 무엇이 중요한지, 정치권력과 교회가 어떤 관계를 맺어야 하는지는 쉽게 한 가지 답으로 결정되지 않았습니다.\n\n이 이야기의 첫 번째 원칙은 단순합니다. **같은 신앙을 이야기한다고 각 시대와 지역에서 같은 역사를 살았던 것은 아닙니다.**"},{"id":"INTRO-2","heading":"2. 공의회, 위클리프, 후스 — 영향을 받았다고 생각까지 같지는 않습니다","body":"## 2. 공의회, 위클리프, 후스 — 영향을 받았다고 생각까지 같지는 않습니다\n\n고대 교회 지도자들은 예수 그리스도와 신앙의 내용을 어떻게 설명할지 토론했습니다. 교회의 대표자들이 모여 논의하는 회의를 **공의회**라고 합니다. 325년에는 니케아 공의회가, 381년에는 콘스탄티노폴리스 공의회가 열렸습니다. **둘은 하나의 회의를 두 번 부르는 말이 아니라 서로 다른 회의**입니다. 451년 칼케돈 공의회의 결정을 둘러싸고도 지역 교회들의 반응이 같지 않았습니다. 이러한 역사에서 오늘날 동방 정교회와 오리엔트 정교회의 차이를 이해할 실마리를 얻을 수 있습니다. 이들을 다른 아시아의 동방교회까지 합쳐 하나의 조직이라고 생각해서도 안 됩니다.\n\n동로마와 서유럽 교회의 관계 역시 어느 날 한 번에 완성된 분열이 아니었습니다. **1054년**의 갈등은 분열의 상징적인 장면이고, **1204년** 제4차 십자군의 콘스탄티노폴리스 약탈은 관계를 한층 악화시킨 별도 사건입니다.\n\n시간이 흘러 14세기 영국에서 **존 위클리프**는 성경과 교회 권위에 관한 문제를 제기했습니다. 그 저술은 보헤미아의 **얀 후스**에게 영향을 주었습니다. 그러나 두 사람의 성찬 이해까지 같지는 않았습니다. 성찬은 빵과 포도주를 나누며 그리스도를 기억하고 그 의미에 참여하는 예식입니다. 중세 서방 교회는 성찬 중 빵과 포도주의 **실체가 그리스도의 몸과 피로 변화한다**고 가르쳤는데, 이를 실체변화라고 부릅니다.\n\n위클리프는 성찬 후에도 빵의 실체가 남는다고 주장했습니다. **그렇다고 성찬에서 그리스도의 임재나 영적 의미 자체를 단순히 부인한 것은 아닙니다.** 반면 후스는 당시 서방 교회가 가르친 실체변화를 받아들였습니다. 우리는 이 비교에서 중요한 역사 읽기의 방법을 배울 수 있습니다. **사상의 영향을 받았다는 사실과 모든 신학적 입장이 같다는 결론을 구별하는 것**입니다."},{"id":"INTRO-3","heading":"3. 16세기 종교개혁에도 서로 다른 답이 있었습니다","body":"## 3. 16세기 종교개혁에도 서로 다른 답이 있었습니다\n\n1529년 독일 마르부르크에서는 종교개혁 진영의 대표 인물 **마르틴 루터와 울리히 츠빙글리**가 대화했습니다. 여러 신앙 문제에서는 공통점을 확인했지만 성찬을 둘러싼 논쟁은 남았습니다. 두 사람 모두 성경을 중요하게 생각했지만, 성찬에서 그리스도의 몸과 피가 어떤 방식으로 임재하는지에 관해 완전히 합의하지 못했습니다.\n\n이 점 때문에 ‘개신교는 모두 성찬을 단순한 상징으로만 본다’는 표현은 역사적으로 옳지 않습니다. 1529년의 마르부르크 조항에는 합의한 문제와 남겨진 문제가 함께 기록되어 있습니다.\n\n같은 시대의 **가톨릭교회** 역시 내부의 교리와 제도를 논의하며 쇄신을 추진했습니다. 특히 **1547년 트리엔트 공의회 제6회기**에서는 *칭의*를 다루었습니다. 칭의란 사람이 하나님 앞에서 어떻게 의롭다고 인정받는가에 관한 신학적 질문입니다. 루터파·가톨릭 등 여러 공동체는 은총과 믿음, 인간의 응답을 어떻게 설명할지 논쟁했습니다. 어느 한쪽의 주장만을 ‘선행만으로 구원’이나 ‘생활은 중요하지 않음’으로 단순화하면 당시의 논쟁을 이해할 수 없습니다.\n\n따라서 같은 성경을 읽고 예수 그리스도를 이야기하는 공동체도 **성찬·구원·교회에 대한 설명이 서로 달랐다**는 점을 기억해야 합니다."},{"id":"INTRO-4","heading":"4. 신앙과 국가의 합의는 모든 사람의 자유였을까요?","body":"## 4. 신앙과 국가의 합의는 모든 사람의 자유였을까요?\n\n15세기 보헤미아에서는 교회 개혁을 요구하는 사람들이 **프라하 4개조**라는 공동의 요구를 제시했습니다. 그 내용에는 복음의 자유로운 설교, 평신도의 양형 영성체, 성직자의 세속 권력과 재산 문제, 중대한 죄에 대한 처벌 요구가 포함됐습니다. 양형 영성체는 평신도도 빵과 포도주의 두 형태로 성찬에 참여하는 것을 말합니다. 이것은 성찬을 단순한 상징으로 이해한다는 뜻과는 다릅니다.\n\n이 요구의 중요한 문안은 **1420년 여름**에 정리되고 여러 언어로 전해졌습니다. **1421년 차슬라프 회의**에서는 법적·정치적 지위가 달라졌습니다. 이후 **1433년 바젤에서의 협상**, **1436년 이흘라바에서의 콤팍타타 공적 공포**가 이어졌습니다. 콤팍타타는 당시 가톨릭 측과 보헤미아의 온건 후스파가 이견을 조정하려 한 합의였습니다. 같은 운동에 속한다 해도 요구를 적은 문서, 협상, 합의의 공포는 각기 다른 사건입니다.\n\n16세기의 **1555년 아우크스부르크 화의**도 갈등을 조정하는 중요한 합의였습니다. 그러나 당시 신성로마제국에서 주로 가톨릭과 아우크스부르크 신앙고백을 따르는 루터파의 법적 지위를 다룬 것이며, 모든 개인에게 현대적 의미의 보편적인 종교 자유를 보장한 것은 아닙니다. 다른 신앙 집단은 그 합의의 보호 범위 밖에 놓일 수 있었습니다. 다른 신앙고백을 선택한 일부 주민에게는 세금·재산 처분 등의 조건을 따른 이주가 허용되기도 했습니다. 그러나 예속 상태에 있는 주민의 이동은 영주의 권한과도 얽혀 있었으므로, 모든 사람의 선택권이 동등하게 보장된 것은 아니었습니다.\n\n이와 관련해 **1648년 베스트팔렌의 법적 합의**는 또 다른 시기와 범위를 다뤘습니다. 한 시대의 제한된 타협을 오늘날의 인권 개념으로 그대로 번역하지 않는 것이 역사 읽기에 중요합니다."},{"id":"INTRO-5","heading":"5. 신앙을 자신의 언어로 옮긴 사람들","body":"## 5. 신앙을 자신의 언어로 옮긴 사람들\n\n기독교는 16세기 유럽에서 처음으로 아시아에 전해진 것이 아닙니다. 중국의 **경교비는 781년에 건립된 비석**으로, 비문은 **635년에 중국에 도착했다고 전하는 기독교의 초기 역사**를 회고합니다. 635년의 사건을 적은 비문이 781년에 제작된 것이므로 두 연도는 다릅니다. 오늘날 박물관이 보여 주는 사진과 탁본도 원래 비석보다 훨씬 후대에 제작된 별도의 자료입니다.\n\n근대로 들어와 1706년 남인도 트랑케바르에 도착한 **바르톨로메우스 치겐발크**는 타밀어를 배우고 문헌을 연구하는 과정에서 현지인의 도움을 받았습니다. 그의 도착이 곧 타밀어 신약전서의 출판을 의미하지는 않습니다. 번역 작업은 인쇄보다 먼저 진행됐습니다. **1714년에는 네 복음서와 사도행전 부분이 인쇄됐고, 1715년에는 나머지 책을 포함한 신약전서 전체가 갖춰졌습니다.** 일부 역사 해설은 인쇄 사업 전체를 ‘1714년’으로 간단히 표기하지만, 독자는 부분 인쇄와 완성본 출판을 구별해야 합니다. 언어를 아는 현지인, 인쇄와 교육을 맡은 사람들을 제외하면 이 역사는 유럽 선교사 한 사람의 업적으로만 보이게 됩니다.\n\n한국에서도 출발점은 하나가 아닙니다. 조선에서는 서학을 스스로 공부하던 한국인들 사이에서 천주교 신앙공동체가 형성됐습니다. **1784년 이승훈이 중국에서 세례를 받고 돌아온 뒤의 공동체 형성**을 중요한 출발점으로 설명하는 연구가 많습니다. 그러나 **1779년의 학문 모임**을 교회 형성과 연결시키는 해석도 있으며, 그 모임을 이미 천주교 공동체로 볼 수 있는지는 연구자들 사이에서 논쟁이 있습니다. 이는 19세기 개신교의 성경 번역과는 별도의 역사입니다.\n\n개신교 초기 한국어 성경 번역에서는 존 로스·존 매킨타이어와 함께 **이응찬·백홍준·서상륜·이성하 등 한국인 협력자**가 중요한 역할을 했습니다. **1882년**에는 누가복음 등 *개별 한글 복음서*가 출판되었고, **1887년**에는 한글 *신약전서*인 『예수셩교젼셔』가 출판되었습니다. 하지만 신약전서가 신약과 구약을 모두 담은 성경 전체를 뜻하지는 않습니다. **한국 개신교 번역사에서 신·구약을 함께 갖춘 한글 『셩경젼셔』가 1911년 출판**됐습니다. 이 책의 출판은 앞선 천주교 신앙공동체의 역사나 이후 성경 개역의 역사를 대신하지 않습니다.\n\n선교사의 도착일, 번역이 끝난 시기, 일부 성경책의 첫 인쇄, 신약전서의 완성본 출판, 신·구약 성경전서 출판은 모두 서로 다른 사건입니다. 또한 번역에서 중요한 일은 외국어를 옮기는 것뿐 아니라 **현지인들이 자기 언어로 그 내용을 읽고 해석하며 공동체를 형성했다는 점**입니다."},{"id":"INTRO-6","heading":"6. 여덟 권을 가로지르는 세 가지 발견","body":"## 6. 여덟 권을 가로지르는 세 가지 발견\n\n이 이야기를 통해 세 가지를 생각할 수 있습니다.\n\n첫째, 비슷한 신앙의 질문이라도 지역과 시대에 따라 다른 대답이 나왔습니다.\n\n둘째, 한 사건의 날짜와 그 사건을 전하는 비문·출판물·협약의 작성 날짜를 나누어야 합니다.\n\n셋째, 세계 교회는 유럽의 지도자만이 아니라 **아프리카·아시아·한국 등 여러 지역의 신앙공동체가 함께 만들어 온 역사**입니다.\n\n이제 종교개혁을 더 깊이 알아보고 싶다면 고대부터 시대순으로 읽을 수도 있고, 지역을 지도에서 비교할 수도 있습니다. 또 *성경과 권위*, *은총과 구원*, *성찬과 예배*, *교회조직과 일상생활*, *국가·갈등·공존*, *번역과 지역 수용* 중 한 가지 질문을 따라가 볼 수도 있습니다.\n\n**이제 글을 덮고, 별도로 주어진 이해도 질문에 답해 주세요.**"}]}}</script><script>
"use strict";(()=>{const data=JSON.parse(document.getElementById("atlas-json").textContent),main=document.getElementById("main"),search=document.getElementById("search");
const vmap=new Map(data.volumes.map(x=>[x.id,x])),tmap=new Map(data.themes.map(x=>[x.id,x]));
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/\x60([^\x60]+)\x60/g,"<code>$1</code>");
function md(s){return String(s||"").trim().split(/\n\s*\n/).map(p=>{p=p.trim();if(!p)return "";if(/^---+$/.test(p))return "<hr>";let h=p.match(/^(#{1,4})\s+([\s\S]+)$/);if(h)return "<h"+Math.min(4,Math.max(2,h[1].length))+">"+inline(h[2])+"</h"+Math.min(4,Math.max(2,h[1].length))+">";if(p.startsWith(">"))return "<blockquote>"+inline(p.replace(/^>\s?/gm,""))+"</blockquote>";return "<p>"+inline(p).replace(/\n/g," ")+"</p>";}).join("");}
const hero=(k,t,d,stats)=>'<div class="hero"><small>'+esc(k)+'</small><h1>'+esc(t)+'</h1><p>'+esc(d)+'</p><div class="counter">'+esc(stats||"")+'</div></div>';
const card=(k,t,d,link)=>'<button class="card" data-go="'+esc(link)+'"><small>'+esc(k)+'</small><h2>'+esc(t)+'</h2><p>'+esc(d)+'</p><div class="more">내용 읽기 ↗</div></button>';
const route=()=>{let p=decodeURIComponent((location.hash||"#/volumes").replace(/^#\//,"")).split("/");return {kind:p[0],id:p[1]};};
const index=(kind)=>{const volumes=kind==="volumes",items=volumes?data.volumes:data.themes;return hero(volumes?"01 · HISTORICAL VOLUMES":"02 · SIX THEMES",volumes?"여덟 권의 역사":"여섯 가지 질문",volumes?"시대별 역사 일곱 권과 주제 아카이브 한 권.":"하나의 질문으로 일곱 역사권을 비교합니다.",volumes?"8권 · 시대권 7 + 주제권 1":"6주제 · 권별 연결 42개")+'<div class="grid">'+items.map(x=>card(x.id,x.title,volumes?x.summary:x.question,"#/"+kind+"/"+x.id)).join("")+"</div>";};
function volume(id){let x=vmap.get(id);if(!x)return index("volumes");let i=data.volumes.indexOf(x),others=data.themes.map(t=>({t,a:t.anchors.find(a=>a.volume_id===x.id)})).filter(z=>z.a);return '<button class="back" data-go="#/volumes">← 여덟 권</button>'+hero(x.id,x.title,x.question,x.period||"전 시대")+'<div class="paper"><article class="article">'+md(x.body)+'</article></div><h2 class="section-title">이 권을 읽는 여섯 질문</h2><div class="anchors">'+others.map(z=>'<button class="anchor" data-go="#/themes/'+esc(z.t.id)+'"><small>'+esc(z.t.id)+'</small><strong>'+esc(z.t.title)+'</strong><small>'+esc(z.a.title)+'</small></button>').join("")+'</div><div class="controls">'+(i>0?'<button data-go="#/volumes/'+data.volumes[i-1].id+'">← 이전 권</button>':'<span></span>')+(i<7?'<button data-go="#/volumes/'+data.volumes[i+1].id+'">다음 권 →</button>':'<button data-go="#/themes">주제 보기 →</button>')+'</div>';}
function roleName(x){return x==="CORE_CASE"?"핵심 사례":x==="CONTEXT_BRIDGE"?"맥락 연결":x==="LIMITED_CONTEXT_NOT_DOCTRINE"?"제한된 배경":x;}function theme(id){let x=tmap.get(id);if(!x)return index("themes");return '<button class="back" data-go="#/themes">← 여섯 주제</button>'+hero(x.id,x.title,x.question,"일곱 시대권의 관련 원고로 연결")+'<div class="paper"><article class="article">'+md(x.body)+'</article></div><h2 class="section-title">연결된 역사권 · 실제 원고 이동</h2><div class="anchors">'+x.anchors.map(a=>'<button class="anchor" data-go="#/volumes/'+esc(a.volume_id)+'"><small>'+esc(a.volume_id)+'</small><strong>'+esc(a.title)+'</strong><small>'+esc(vmap.get(a.volume_id).title)+' · '+esc(roleName(a.role))+'</small></button>').join("")+'</div>';}
function reader(num){let i=Math.min(6,Math.max(1,parseInt(num,10)||1)),s=data.reader.scenes[i-1];return '<button class="back" data-go="#/volumes">← 역사권 목록</button>'+hero("03 · GUIDED READING",data.reader.title,"입문 6장면을 차례대로 읽습니다. 독서 10분은 목표이며 실제 측정값이 아닙니다.",i+" / 6장면 · 참여자 점수 기록 없음")+'<div class="reader-nav">'+data.reader.scenes.map((x,n)=>'<button aria-current="'+(n+1===i?"step":"false")+'" data-go="#/reader/'+(n+1)+'">'+(n+1)+'장</button>').join("")+'</div>'+(i===1?'<div class="alert">'+md(data.reader.preface)+'</div>':"")+'<div class="paper"><article class="article">'+md(s.body)+'</article></div><div class="controls">'+(i>1?'<button data-go="#/reader/'+(i-1)+'">← 이전 장면</button>':'<span></span>')+(i<6?'<button data-go="#/reader/'+(i+1)+'">다음 장면 →</button>':'<button data-go="#/themes">여섯 주제 보기 →</button>')+'</div><p class="counter">독해 내용은 저장되지 않으며, 평가 정답은 이 화면에 포함하지 않습니다.</p>';}
function verify(){let errors=[],A=data.themes.flatMap(t=>t.anchors.map(a=>t.id+"/"+a.volume_id));if(data.volumes.length!==8)errors.push("volume count");if(data.themes.length!==6)errors.push("theme count");if(data.reader.scenes.length!==6)errors.push("reader count");if(A.length!==42||new Set(A).size!==42)errors.push("anchor count or duplicates");for(let t of data.themes)for(let a of t.anchors)if(!vmap.has(a.volume_id)||!a.ref)errors.push("orphan "+a.volume_id);if(data.can_ship)errors.push("unauthorized ship");return errors;}
function check(){let bad=verify();return hero("04 · INTEGRITY","내부 콘텐츠 점검","정적 원고의 등록·연결 여부만 확인합니다. 브라우저 자동화 또는 실제 사람 검증과 다릅니다.",bad.length?"검증 오류 "+bad.length:"데이터 구조 검사 이상 없음")+'<div class="paper"><h2>'+esc(bad.length?"점검 오류":"구조 점검 통과")+'</h2>'+(bad.length?"<ul>"+bad.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"<p>8권·6주제·6장면·42개 권별 연결을 모두 확인했습니다.</p>")+'<div class="alert">외부 전문가, 실제 독자, 원전 사용 권리, 접근성 및 AI Studio 통합 검토는 별도로 필요합니다.</div><p class="counter">원본 Git blob: '+esc(data.source_sha.slice(0,16))+' / can_ship=false</p></div>';}
function result(){let q=search.value.trim().toLocaleLowerCase("ko"),list=[...data.volumes.map(x=>({id:x.id,title:x.title,desc:x.summary,body:x.body,url:"#/volumes/"+x.id})),...data.themes.map(x=>({id:x.id,title:x.title,desc:x.question,body:x.body,url:"#/themes/"+x.id})),...data.reader.scenes.map((x,i)=>({id:x.id,title:x.heading,desc:"입문 원고 "+(i+1)+"장",body:x.body,url:"#/reader/"+(i+1)}))].filter(x=>(x.title+" "+x.desc+" "+x.body).toLocaleLowerCase("ko").includes(q));return hero("SEARCH","전체 원고 검색",q?"검색어: "+q:"검색어를 입력해 주세요.",q?list.length+"개 원고 검색 결과":"20개 원고 대상")+(q?(list.length?'<div class="grid">'+list.map(x=>card(x.id,x.title,x.desc,x.url)).join("")+"</div>":'<div class="empty">일치하는 문서가 없습니다.</div>'):'<div class="empty">검색창에 역사 용어를 입력하세요.</div>');}
function render(){let r=route();let section=r.kind==="search"?"search":(["volumes","themes","reader","check"].includes(r.kind)?r.kind:"volumes");for(let v of ["volumes","themes","reader","check"]){let e=document.getElementById("nav-"+v);if(e){if(v===section)e.setAttribute("aria-current","page");else e.removeAttribute("aria-current");}}
main.innerHTML=section==="volumes"?(r.id?volume(r.id):index("volumes")):section==="themes"?(r.id?theme(r.id):index("themes")):section==="reader"?reader(r.id):section==="check"?check():result();
if(section!=="search"){search.value="";if(typeof main.focus==="function")main.focus({preventScroll:true});}scrollTo(0,0);}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-go]");if(!b)return;const target=b.dataset.go;if(location.hash===target)render();else location.hash=target;});
search.addEventListener("input",()=>{if(!search.value.trim()){location.hash="#/volumes";return;}if(location.hash==="#/search")render();else location.hash="#/search";});
addEventListener("hashchange",render);render();
})();</script></body></html>
