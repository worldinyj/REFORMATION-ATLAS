<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 845" width="1500" height="845" role="img" aria-labelledby="v03title v03desc">
<title id="v03title">제3권: 12~16세기 중세 개혁운동의 여러 갈래</title>
<desc id="v03desc">발도의 왈도파는 1532년 전후 개혁파와 연결된다. 영국 위클리프의 사상은 문헌을 통해 후스에게 영향을 주었고, 후스의 사후 후스파와 보헤미아 형제단이 형성되었다. 루터와의 연결은 후대 수용으로서 점선으로 표시한다. 왈도파에서 위클리프까지 직접 이어지는 선은 없다.</desc>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#42677c" fill="none" stroke-width="1.9"/></marker>
  <marker id="darr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#9a7053" fill="none" stroke-width="1.9"/></marker>
</defs>
