name: VOL-04 Melanchthon deep research QA
on:
  push:
    branches:
      - research/vol04-melanchthon-deep-v01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify eight-volume overview baseline
        run: python3 scripts/validate_atlas_overview_v01.py
      - name: Verify Luther research
        run: python3 scripts/validate_vol04_luther_deep_v01.py
      - name: Verify Zwingli research
        run: python3 scripts/validate_vol04_zwingli_deep_v01.py
      - name: Verify Melanchthon research and image gates
        run: python3 scripts/validate_vol04_melanchthon_deep_v01.py
