name: Atlas V3.17 Early Treaty Print And Diplomatic Original QA
on:
  pull_request:
    paths:
      - 'data/deep/atlas_v317_*'
      - 'docs/02_RESEARCH/V317_*'
      - 'integrations/medium-atlas-v317/**'
      - 'scripts/build_v317_early_print_delivery.mjs'
      - '.github/workflows/atlas-v317-early-print.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical-print-bibliography:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression and source-boundary checks
        run: |
          node --test integrations/medium-atlas-v316/*.test.mjs
          node --test integrations/medium-atlas-v317/*.test.mjs
          node scripts/build_v317_early_print_delivery.mjs --check
          git diff --check HEAD^ HEAD
      - name: Export V3.17 editorial reader and unresolved-source JSON
        run: node scripts/build_v317_early_print_delivery.mjs --export /tmp/atlas-v317-output
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-v317-early-print-scoped-json
          path: /tmp/atlas-v317-output
          retention-days: 14
          if-no-files-found: error
