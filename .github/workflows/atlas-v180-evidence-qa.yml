name: Atlas V180 edition evidence locations QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v180_*'
      - 'scripts/validate_atlas_v180.py'
      - '.github/workflows/atlas-v180-evidence-qa.yml'
  workflow_dispatch:
jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v180.py
      - run: python3 scripts/validate_atlas_v179.py
      - run: python3 scripts/validate_atlas_v178.py
