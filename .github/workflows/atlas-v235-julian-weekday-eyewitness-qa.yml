name: Atlas V235 Julian Monday reconciliation and witness-grade history QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v235_osiander_jonas_julian_weekday_eyewitness_comparison.json'
      - 'docs/01_CONTENT/V235_MARBURG_4_OCT_1529_JONAS_OSIANDER_AND_HESSIAN_MEDIATORS.md'
      - 'scripts/validate_atlas_v235.py'
      - '.github/workflows/atlas-v235-julian-weekday-eyewitness-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v235_osiander_jonas_julian_weekday_eyewitness_comparison.json'
      - 'docs/01_CONTENT/V235_MARBURG_4_OCT_1529_JONAS_OSIANDER_AND_HESSIAN_MEDIATORS.md'
      - 'scripts/validate_atlas_v235.py'
      - '.github/workflows/atlas-v235-julian-weekday-eyewitness-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V235 calendar and critical history checker
        run: python3 -m py_compile scripts/validate_atlas_v235.py
      - name: Historical research V219
        run: python3 scripts/validate_atlas_v219.py
      - name: Historical research V220
        run: python3 scripts/validate_atlas_v220.py
      - name: Historical research V221
        run: python3 scripts/validate_atlas_v221.py
      - name: Historical research V222
        run: python3 scripts/validate_atlas_v222.py
      - name: Historical research V223
        run: python3 scripts/validate_atlas_v223.py
      - name: Historical research V224
        run: python3 scripts/validate_atlas_v224.py
      - name: Historical research V225
        run: python3 scripts/validate_atlas_v225.py
      - name: Historical research V226
        run: python3 scripts/validate_atlas_v226.py
      - name: Historical research V227
        run: python3 scripts/validate_atlas_v227.py
      - name: Historical research V228
        run: python3 scripts/validate_atlas_v228.py
      - name: Historical research V229
        run: python3 scripts/validate_atlas_v229.py
      - name: Historical research V230
        run: python3 scripts/validate_atlas_v230.py
      - name: Historical research V231
        run: python3 scripts/validate_atlas_v231.py
      - name: Historical research V232
