name: Atlas V3.04 Integrated Reading QA
on:
  pull_request:
    paths:
      - 'data/deep/atlas_v304*'
      - 'data/contracts/atlas_v304*'
      - 'integrations/medium-atlas-v304/**'
      - 'scripts/build_v304_integrated_delivery.py'
      - 'docs/03_PRODUCT/V304*'
      - '.github/workflows/atlas-v304-integrated-reading.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce integrated delivery and frozen inputs
        run: |
          python3 scripts/build_v304_integrated_delivery.py --check
          python3 scripts/build_v303_ancient_medieval_readers.py --check
          python3 scripts/build_v302_integrated_delivery.py --check
      - name: Test old and new consumers
        run: node --test integrations/medium-atlas-v304/*.test.mjs integrations/medium-atlas-v298/adapter.test.mjs integrations/overview-readings-v300/bridge.test.mjs
      - name: Prepare Chromium and Korean fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-ui" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/atlas-ui/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify integrated review screen at three widths
        env:
          ATLAS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/atlas-ui/node_modules/playwright
          ATLAS_UI_ARTIFACT_DIR: ${{ runner.temp }}/atlas-v304-ui
        run: node integrations/medium-atlas-v304/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-v304-browser-review
          path: ${{ runner.temp }}/atlas-v304-ui
          if-no-files-found: warn
          retention-days: 14
