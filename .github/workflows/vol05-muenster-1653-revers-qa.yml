name: VOL05 Münster 1653 Revers and 1655 Settlement V1.9 QA
on:
  push:
    branches:
      - research/vol05-chorfrauen-1653-revers-v19
  pull_request:
    branches:
      - research/vol05-1649-chorfrauen-guild-v18
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-settlement-and-primary-source-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overview and V1.8 guild council original folio regressions
        run: |
          python3 scripts/validate_atlas_overview_v01.py
          python3 scripts/validate_vol05_muenster_1649_chorfrauen_v18.py
          python3 scripts/test_vol05_muenster_1649_chorfrauen_negative_v18.py
      - name: V1.9 1653 Revers, 1655 property and APW direct access caveats
        run: |
          python3 scripts/validate_vol05_muenster_1653_revers_v19.py
          python3 scripts/test_vol05_muenster_1653_revers_negative_v19.py
