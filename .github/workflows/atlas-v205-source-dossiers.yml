name: Atlas V205 source dossiers QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v205_source_dossiers.json'
      - 'scripts/validate_atlas_v205.py'
      - '.github/workflows/atlas-v205-source-dossiers.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v202.py
      - run: python3 scripts/validate_atlas_v203.py
      - run: python3 scripts/validate_atlas_v204.py
      - run: python3 scripts/validate_atlas_v205.py
