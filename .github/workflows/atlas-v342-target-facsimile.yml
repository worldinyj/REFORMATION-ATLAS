name: ATLAS V3.42 printed 275–286 leaf image review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  printed-leaves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v342_target_print_275.py
