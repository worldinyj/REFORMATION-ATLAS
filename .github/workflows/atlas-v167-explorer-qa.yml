name: Atlas V167 isolated explorer QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'integrations/atlas-explorer-v167/**'
      - 'scripts/validate_atlas_v167.py'
      - '.github/workflows/atlas-v167-explorer-qa.yml'
  workflow_dispatch:
jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check integrations/atlas-explorer-v167/explorer.mjs
      - run: node --test integrations/ai-studio-readonly-v166/adapter.test.mjs
      - run: python3 scripts/validate_atlas_v167.py
      - run: python3 scripts/validate_atlas_v165.py
      - run: python3 scripts/audit_atlas_all_json_v143.py --root .
