name: Atlas V238 Seckendorff historical book distribution evidence QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v238_seckendorff_1690_1693_subscription_and_distribution.json'
      - 'docs/01_CONTENT/V238_SECKENDORFF_1690_1693_BOOK_SUBSCRIPTION_DISTRIBUTION_AND_LETTERS_REPORT.md'
      - 'scripts/validate_atlas_v238.py'
      - '.github/workflows/atlas-v238-book-production-and-distribution-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v238_seckendorff_1690_1693_subscription_and_distribution.json'
      - 'docs/01_CONTENT/V238_SECKENDORFF_1690_1693_BOOK_SUBSCRIPTION_DISTRIBUTION_AND_LETTERS_REPORT.md'
      - 'scripts/validate_atlas_v238.py'
      - '.github/workflows/atlas-v238-book-production-and-distribution-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V238 documentary validator
        run: python3 -m py_compile scripts/validate_atlas_v238.py
