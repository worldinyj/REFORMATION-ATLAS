name: Atlas V173 six longform drafts QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'docs/01_CONTENT/V173_*'
      - 'scripts/validate_atlas_v173.py'
      - '.github/workflows/atlas-v173-depth-qa.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v173.py
      - run: python3 scripts/validate_atlas_v172.py
      - run: python3 scripts/validate_atlas_v165.py
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-v173-content-audit
          path: v173-audit.json
