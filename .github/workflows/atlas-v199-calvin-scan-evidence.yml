name: Atlas V199 Calvin original scan evidence QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v199_*'
      - 'scripts/validate_atlas_v199.py'
      - '.github/workflows/atlas-v199-calvin-scan-evidence.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v199.py
      - run: python3 scripts/validate_atlas_v198.py
