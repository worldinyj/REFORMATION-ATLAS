name: Atlas V3.08 Integrated 513 QA
on:
  pull_request:
    paths:
      - 'integrations/medium-atlas-v308/**'
      - 'scripts/build_v308_integrated_delivery.mjs'
      - 'docs/03_PRODUCT/V308_*'
      - '.github/workflows/atlas-v308-integrated-reading.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check frozen manuscripts and 513-reader integration
        run: |
          python3 scripts/build_v305_pietism_revival_readers.py --check
          python3 scripts/check_v307_remaining_overview_readers.py
          python3 scripts/build_v304_integrated_delivery.py --check
          node --test integrations/medium-atlas-v308/integration.test.mjs
          node scripts/build_v308_integrated_delivery.mjs --check
          git diff --check HEAD^ HEAD
      - name: Export 513-reader and overview JSON deliverables
        run: node scripts/build_v308_integrated_delivery.mjs --export /tmp/atlas-v308-delivery
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-v308-513-json-preview
          path: /tmp/atlas-v308-delivery
          retention-days: 14
          if-no-files-found: error
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Chromium and Korean fonts
        run: |
          npm install --prefix /tmp/atlas-v308-node --no-save --ignore-scripts playwright@1.56.1
          /tmp/atlas-v308-node/node_modules/.bin/playwright install --with-deps chromium --only-shell
          sudo apt-get install -y fonts-noto-cjk
      - name: Review 513 reader UI at three viewport widths
        env:
          ATLAS_PLAYWRIGHT_MODULE: /tmp/atlas-v308-node/node_modules/playwright
          ATLAS_UI_ARTIFACT_DIR: /tmp/atlas-v308-ui
        run: node integrations/medium-atlas-v308/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-v308-browser-review
          path: /tmp/atlas-v308-ui
          retention-days: 14
          if-no-files-found: warn
