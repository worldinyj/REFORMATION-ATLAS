name: VOL-04 Calvin research and visual QA
on:
  push:
    branches:
      - research/vol04-calvin-deep-v01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing eight-volume overview QA
        run: python3 scripts/validate_atlas_overview_v01.py
      - name: Luther research QA
        run: python3 scripts/validate_vol04_luther_deep_v01.py
      - name: Zwingli research QA
        run: python3 scripts/validate_vol04_zwingli_deep_v01.py
      - name: Melanchthon research QA
        run: python3 scripts/validate_vol04_melanchthon_deep_v01.py
      - name: Calvin sources, claim references and media gates
        run: python3 scripts/validate_vol04_calvin_deep_v01.py
