name: VOL05 Kramergilde Named Merchants and Original Book V1.7 QA
on:
  push:
    branches:
      - research/vol05-kramergilde-named-admissions-v17
  pull_request:
    branches:
      - research/vol05-kramergilde-edition-archive-audit-v16
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persons-archive-identity-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical overview and V1.6 source-access regressions
        run: |
          python3 scripts/validate_atlas_overview_v01.py
          python3 scripts/validate_vol05_kramergilde_archive_audit_v16.py
          python3 scripts/test_vol05_kramergilde_archive_audit_negative_v16.py
      - name: V1.7 1670 widow identity, 1719 member, 1720 merchant and distinct guild books
        run: |
          python3 scripts/validate_vol05_kramergilde_three_people_v17.py
          python3 scripts/test_vol05_kramergilde_three_people_negative_v17.py
