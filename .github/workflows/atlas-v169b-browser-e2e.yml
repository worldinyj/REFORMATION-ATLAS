name: Atlas V169B corrected browser E2E
on:
  push:
    branches: ['research/**']
    paths:
      - 'integrations/atlas-explorer-v169/playwright.fixed.config.mjs'
      - '.github/workflows/atlas-v169b-browser-e2e.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        working-directory: integrations/atlas-explorer-v169
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real browser tests 4 viewports
        run: integrations/atlas-explorer-v169/node_modules/.bin/playwright test --config=integrations/atlas-explorer-v169/playwright.fixed.config.mjs
      - name: Collect browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v169b-browser-evidence
          path: |
            integrations/atlas-explorer-v169/playwright-report
            integrations/atlas-explorer-v169/test-results
          retention-days: 14
      - name: Prior research data QA
        run: python3 scripts/validate_atlas_v165.py
