name: Atlas V209 research reader rebase QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v209_unified_ten_revised_readers.json'
      - 'scripts/validate_atlas_v209.py'
      - '.github/workflows/atlas-v209-reader-rebase.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v202.py
      - run: python3 scripts/validate_atlas_v203.py
      - run: python3 scripts/validate_atlas_v204.py
      - run: python3 scripts/validate_atlas_v205.py
      - run: python3 scripts/validate_atlas_v206.py
      - run: python3 scripts/validate_atlas_v207.py
      - run: python3 scripts/validate_atlas_v208.py
      - run: python3 scripts/validate_atlas_v209.py
