name: ATLAS V3.42 Commons page-scoped print facsimile probe
on:
  push:
    branches:
      - research/atlas-v342-cr26-1858-print-collation
    paths:
      - scripts/research_v342_commons_page_thumbnails.py
      - .github/workflows/atlas-v342-commons-page-thumbnails.yml
  pull_request:
    paths:
      - scripts/research_v342_commons_page_thumbnails.py
      - .github/workflows/atlas-v342-commons-page-thumbnails.yml
permissions:
  contents: read
jobs:
  thumb-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v342_commons_page_thumbnails.py
