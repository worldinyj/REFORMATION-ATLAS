name: ATLAS V3.39 Bamberg 1531 IIIF metadata probe
on:
  push:
    branches:
      - research/atlas-v339-1531-iiif-canvas-locator
    paths:
      - scripts/inspect_v339_bamberg_iiif.mjs
      - scripts/inspect_v339_confessio_sibling.mjs
      - .github/workflows/atlas-v339-bamberg-iiif-probe.yml
  pull_request:
    paths:
      - scripts/inspect_v339_bamberg_iiif.mjs
      - .github/workflows/atlas-v339-bamberg-iiif-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-iiif-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect 1531 Bamberg IIIF canvas metadata only
        run: node scripts/inspect_v339_bamberg_iiif.mjs
      - name: Check separate Confessio sibling record
        run: node scripts/inspect_v339_confessio_sibling.mjs
      - name: Upload review-only metadata (no copyrighted page scans)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v339-iiif-canvas-review
          path: out/atlas-v339/*.json
          if-no-files-found: ignore
          retention-days: 7
