name: ATLAS V3.49 high resolution 1836 print access follow-up
on:
  pull_request:
    paths:
      - scripts/research_v349_1836_image_fidelity_probe.py
      - .github/workflows/atlas-v349-image-fidelity.yml
permissions:
  contents: read
jobs:
  source-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v349_1836_image_fidelity_probe.py
