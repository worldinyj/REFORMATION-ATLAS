name: Atlas V3.16 Ratification Chronology QA
on:
  pull_request:
    paths:
      - 'data/contracts/atlas_v316_*'
      - 'docs/02_RESEARCH/V316_*'
      - 'integrations/medium-atlas-v316/**'
      - 'scripts/build_v316_ratification_delivery.mjs'
      - '.github/workflows/atlas-v316-ratification-chronology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frozen V315 corpus and separate signing from ratification
        run: |
          node --test integrations/medium-atlas-v315/*.test.mjs
          node --test integrations/medium-atlas-v316/*.test.mjs
          node scripts/build_v316_ratification_delivery.mjs --check
          git diff --check HEAD^ HEAD
      - name: Export V316 scoped chronology data
        run: node scripts/build_v316_ratification_delivery.mjs --export /tmp/atlas-v316
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-v316-ratification-chronology-json
          path: /tmp/atlas-v316
          retention-days: 14
          if-no-files-found: error
