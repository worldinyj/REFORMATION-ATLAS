name: Atlas V186 article IV apparatus QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v186_*'
      - 'scripts/validate_atlas_v186.py'
      - '.github/workflows/atlas-v186-apparatus-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v186.py
      - run: python3 scripts/validate_atlas_v185.py
