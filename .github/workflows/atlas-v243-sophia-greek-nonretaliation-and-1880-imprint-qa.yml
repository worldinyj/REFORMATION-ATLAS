name: Atlas V243 1525 Sophia Greek parallels and 1880 volume/1881 imprint QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v243_sophia_1880_1881_edition_and_biblical_nonretaliation_parallels.json'
      - 'docs/01_CONTENT/V243_SOPHIA_1525_BIBLICAL_NONRETALIATION_AND_KAWERAU_1880_1881_IMPRINT_REPORT.md'
      - 'scripts/validate_atlas_v243.py'
      - '.github/workflows/atlas-v243-sophia-greek-nonretaliation-and-1880-imprint-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v243_sophia_1880_1881_edition_and_biblical_nonretaliation_parallels.json'
      - 'docs/01_CONTENT/V243_SOPHIA_1525_BIBLICAL_NONRETALIATION_AND_KAWERAU_1880_1881_IMPRINT_REPORT.md'
      - 'scripts/validate_atlas_v243.py'
      - '.github/workflows/atlas-v243-sophia-greek-nonretaliation-and-1880-imprint-qa.yml'
  workflow_dispatch:
jobs:
