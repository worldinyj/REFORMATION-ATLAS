name: Atlas V200 ten reader quality audit
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v200_*'
      - 'scripts/validate_atlas_v200.py'
      - '.github/workflows/atlas-v200-reader-audit.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v200.py
