name: Atlas V174 substantive Marburg QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v174_*'
      - 'scripts/validate_atlas_v174.py'
      - '.github/workflows/atlas-v174-substantive-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v174.py
      - run: python3 scripts/validate_atlas_v173.py
      - run: python3 scripts/audit_atlas_all_json_v143.py --root .
