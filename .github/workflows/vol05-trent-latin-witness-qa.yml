name: VOL-05 Trent Latin Witness and Print Edition QA
on:
  push:
    branches:
      - research/vol05-trent-latin-witness-v01
  pull_request:
    branches:
      - research/vol05-trent-catholic-reform-v01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latin-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base scholarly research and baseline publication gate
        run: |
          python3 scripts/validate_atlas_overview_v01.py
          python3 scripts/validate_vol05_trent_research_v01.py
          python3 scripts/test_vol05_trent_negative_v01.py
      - name: Latin anchors, copy/format, original collation and rights gate
        run: |
          python3 scripts/validate_vol05_trent_latin_witness_v01.py
          python3 scripts/test_vol05_trent_latin_witness_negative_v01.py
