name: ATLAS V3.49 original 1836 CR III access audit
on:
  push:
    branches:
      - research/atlas-v349-cr3-1836-concord-direct-print
    paths:
      - scripts/research_v349_cr3_google_print_access.py
      - .github/workflows/atlas-v349-cr3-source-access.yml
  pull_request:
    paths:
      - scripts/research_v349_cr3_google_print_access.py
      - .github/workflows/atlas-v349-cr3-source-access.yml
permissions:
  contents: read
jobs:
  bounded-access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v349_cr3_google_print_access.py
