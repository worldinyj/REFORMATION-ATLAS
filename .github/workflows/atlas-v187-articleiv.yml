name: Atlas V187 Article IV comparison QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v187_*'
      - 'scripts/validate_atlas_v187.py'
      - '.github/workflows/atlas-v187-articleiv.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v187.py
      - run: python3 scripts/validate_atlas_v186.py
