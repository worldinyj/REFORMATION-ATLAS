name: Atlas V220 critical variant collation QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v220_marburg_augsburg_variant_collation.json'
      - 'scripts/validate_atlas_v220.py'
      - 'docs/01_CONTENT/V220_MARBURG_AUGSBURG_WITNESS_COLLATION_REPORT.md'
      - '.github/workflows/atlas-v220-variant-collation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact V219 reader corpus invariants
        run: python3 scripts/validate_atlas_v219.py
      - name: Validate V220 evidence and variant links
        run: python3 scripts/validate_atlas_v220.py
