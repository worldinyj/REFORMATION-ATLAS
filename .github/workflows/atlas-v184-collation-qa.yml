name: Atlas V184 witness collation QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v184_*'
      - 'scripts/validate_atlas_v184.py'
      - '.github/workflows/atlas-v184-collation-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v184.py
      - run: python3 scripts/validate_atlas_v183.py
