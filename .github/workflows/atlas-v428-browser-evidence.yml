name: ATLAS V4.28 Responsive Focus Browser Evidence
on:
  push:
    branches:
      - research/atlas-v428-responsive-focus-browser-fixes-l0
    paths:
      - ".github/workflows/atlas-v428-browser-evidence.yml"
      - "preview/V424_L0_EDITORIAL_ALPHA_OFFLINE_PREVIEW.html"
      - "research/tests/v428_multi_engine_browser_probe.cjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright engines
        id: browsers
        continue-on-error: true
        run: |
          mkdir -p /tmp/atlas-v428-tools research/artifacts/V428_browser_evidence
          set +e
          npm install --prefix /tmp/atlas-v428-tools --no-save --no-package-lock playwright@1.56.1 > research/artifacts/V428_browser_evidence/INSTALL_LOG.txt 2>&1
          INSTALL_CODE=$?
          if test "$INSTALL_CODE" = 0; then
            /tmp/atlas-v428-tools/node_modules/.bin/playwright install --with-deps chromium webkit >> research/artifacts/V428_browser_evidence/INSTALL_LOG.txt 2>&1
            ENGINE_CODE=$?
          else
            ENGINE_CODE=99
          fi
          echo "NPM_EXIT=$INSTALL_CODE" >> research/artifacts/V428_browser_evidence/INSTALL_LOG.txt
          echo "BROWSER_INSTALL_EXIT=$ENGINE_CODE" >> research/artifacts/V428_browser_evidence/INSTALL_LOG.txt
          tail -60 research/artifacts/V428_browser_evidence/INSTALL_LOG.txt
          test "$INSTALL_CODE" = 0 && test "$ENGINE_CODE" = 0
      - name: Run exact-source Chromium and WebKit checks
        if: always()
        id: e2e
        env:
          NODE_PATH: /tmp/atlas-v428-tools/node_modules
        run: |
          set +e
          mkdir -p research/artifacts/V428_browser_evidence
          ATLAS_BROWSER_ENGINE=chromium node research/tests/v428_multi_engine_browser_probe.cjs > research/artifacts/V428_browser_evidence/CHROMIUM_E2E_LOG.txt 2>&1
          CHROME_CODE=$?
          ATLAS_BROWSER_ENGINE=webkit node research/tests/v428_multi_engine_browser_probe.cjs > research/artifacts/V428_browser_evidence/WEBKIT_E2E_LOG.txt 2>&1
          WEBKIT_CODE=$?
          echo "chromium_exit=$CHROME_CODE" >> "$GITHUB_OUTPUT"
          echo "webkit_exit=$WEBKIT_CODE" >> "$GITHUB_OUTPUT"
          echo "CHROMIUM_E2E_EXIT=$CHROME_CODE"
          tail -25 research/artifacts/V428_browser_evidence/CHROMIUM_E2E_LOG.txt
          echo "WEBKIT_E2E_EXIT=$WEBKIT_CODE"
          tail -25 research/artifacts/V428_browser_evidence/WEBKIT_E2E_LOG.txt
          exit 0
      - name: Keep JSON results in research branch
        if: always()
        env:
          E_CHROMIUM: ${{ steps.e2e.outputs.chromium_exit }}
          E_WEBKIT: ${{ steps.e2e.outputs.webkit_exit }}
          E_SETUP: ${{ steps.browsers.outcome }}
        run: |
          mkdir -p research/artifacts/V428_browser_evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('research/artifacts/V428_browser_checks')
          dst=Path('research/artifacts/V428_browser_evidence')
          names=['chromium','webkit']
          log_file=dst/'INSTALL_LOG.txt'
          install_log=log_file.read_text(errors='replace') if log_file.exists() else 'MISSING'
          out={'version':'V4.28','source':'preview/V424_L0_EDITORIAL_ALPHA_OFFLINE_PREVIEW.html','setup':{'outcome':os.environ.get('E_SETUP'),'install_log_tail':install_log[-6500:]},'engines':{},'release':{'can_ship':False,'actual_human_review_completed':False}}
          for name in names:
              reports=list((root/name).glob('V428_*_BROWSER_REPORT.json'))
              result=json.loads(reports[0].read_text()) if reports else None
              out['engines'][name]={'report_present':result is not None,'test_report':result,'exit_code':os.environ.get('E_'+name.upper())}
          (dst/'V428_BROWSER_E2E_RESULTS.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/artifacts/V428_browser_evidence/V428_BROWSER_E2E_RESULTS.json
          for engine in CHROMIUM WEBKIT; do
            log="research/artifacts/V428_browser_evidence/${engine}_E2E_LOG.txt"
            if test -f "$log"; then git add "$log"; fi
          done
          if test -f research/artifacts/V428_browser_evidence/INSTALL_LOG.txt; then git add research/artifacts/V428_browser_evidence/INSTALL_LOG.txt; fi
          for engine in chromium webkit; do
            for name in desktop-volumes mobile-volumes small-mobile-themes small-mobile-VOL-06; do
              img="research/artifacts/V428_browser_checks/$engine/$name.png"
              if test -f "$img"; then git add "$img"; fi
            done
          done
          if ! git diff --cached --quiet; then
            git commit -m 'test(atlas): V4.28 real browser evidence [skip ci]'
            git push origin HEAD:refs/heads/research/atlas-v428-responsive-focus-browser-fixes-l0
          fi
      - name: Upload complete screenshots and JSON logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v428-full-browser-evidence
          path: |
            research/artifacts/V428_browser_checks/
            research/artifacts/V428_browser_evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Final browser verdict
        if: always()
        env:
          E_CHROMIUM: ${{ steps.e2e.outputs.chromium_exit }}
          E_WEBKIT: ${{ steps.e2e.outputs.webkit_exit }}
          E_SETUP: ${{ steps.browsers.outcome }}
        run: |
          test "$E_SETUP" = success
          test "$E_CHROMIUM" = 0
          test "$E_WEBKIT" = 0
