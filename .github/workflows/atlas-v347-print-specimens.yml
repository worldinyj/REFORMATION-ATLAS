name: ATLAS V3.47 original print VII VIII specimen study
on:
  push:
    branches:
      - research/atlas-v347-ca-vii-viii-1540-press-state
    paths:
      - scripts/research_v347_article_vii_viii_print_images.py
      - .github/workflows/atlas-v347-print-specimens.yml
  pull_request:
    paths:
      - scripts/research_v347_article_vii_viii_print_images.py
      - .github/workflows/atlas-v347-print-specimens.yml
permissions:
  contents: read
jobs:
  two-original-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v347_article_vii_viii_print_images.py
