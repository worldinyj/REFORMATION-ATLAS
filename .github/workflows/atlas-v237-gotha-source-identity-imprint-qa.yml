name: Atlas V237 Jonas accession ID correction and Seckendorff imprint QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v237_gotha_jonas_accession_1691_1692_provenance.json'
      - 'docs/01_CONTENT/V237_GOTHA_JONAS_ACCESSION_CORRECTION_AND_SECKENDORFF_1691_1692_PRODUCTION_REPORT.md'
      - 'scripts/validate_atlas_v237.py'
      - '.github/workflows/atlas-v237-gotha-source-identity-imprint-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v237_gotha_jonas_accession_1691_1692_provenance.json'
      - 'docs/01_CONTENT/V237_GOTHA_JONAS_ACCESSION_CORRECTION_AND_SECKENDORFF_1691_1692_PRODUCTION_REPORT.md'
      - 'scripts/validate_atlas_v237.py'
      - '.github/workflows/atlas-v237-gotha-source-identity-imprint-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V237 provenance checker
