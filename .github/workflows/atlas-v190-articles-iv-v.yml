name: Atlas V190 Articles IV and V QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v190_*'
      - 'scripts/validate_atlas_v190.py'
      - '.github/workflows/atlas-v190-articles-iv-v.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v190.py
      - run: python3 scripts/validate_atlas_v189.py
