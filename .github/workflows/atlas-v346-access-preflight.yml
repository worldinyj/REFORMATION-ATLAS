name: ATLAS V3.46 independent 1540 source access preflight
on:
  push:
    branches:
      - research/atlas-v346-ca-x-1540-independent-facsimile-gate
    paths:
      - scripts/research_v346_1540_witness_access_probe.py
      - .github/workflows/atlas-v346-access-preflight.yml
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/research_v346_1540_witness_access_probe.py
