name: Atlas V198 original source access QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v198_*'
      - 'scripts/validate_atlas_v198.py'
      - '.github/workflows/atlas-v198-original-source-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v198.py
      - run: python3 scripts/validate_atlas_v197.py
