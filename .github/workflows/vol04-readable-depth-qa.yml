name: VOL-04 Readable Deep Research V0.2 QA
on:
  push:
    branches:
      - research/vol04-readable-depth-v02
  pull_request:
    branches:
      - research/vol04-bibliography-editions-v02
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrative-evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Four reformers source-and-claim baseline
        run: |
          python3 scripts/validate_vol04_luther_deep_v01.py
          python3 scripts/validate_vol04_zwingli_deep_v01.py
          python3 scripts/validate_vol04_melanchthon_deep_v01.py
          python3 scripts/validate_vol04_calvin_deep_v01.py
          python3 scripts/validate_vol04_crosswalk_v01.py
      - name: Reader narratives (four manuscripts, twenty blocks, zero released)
        run: python3 scripts/validate_vol04_readable_depth_v02.py
