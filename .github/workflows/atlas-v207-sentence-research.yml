name: Atlas V207 sentence editorial research QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v207_sentence_classification_and_provisional_claims.json'
      - 'scripts/validate_atlas_v207.py'
      - '.github/workflows/atlas-v207-sentence-research.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v202.py
      - run: python3 scripts/validate_atlas_v203.py
      - run: python3 scripts/validate_atlas_v204.py
      - run: python3 scripts/validate_atlas_v205.py
      - run: python3 scripts/validate_atlas_v206.py
      - run: python3 scripts/validate_atlas_v207.py
