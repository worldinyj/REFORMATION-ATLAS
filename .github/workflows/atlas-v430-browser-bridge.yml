name: ATLAS V4.30 Real Local Browser Bridge
on:
  push:
    branches:
      - research/atlas-v430-l0-private-staging-runtime-bridge
    paths:
      - "integrations/atlas-l0-v430/bridge.mjs"
      - "integrations/atlas-l0-v430/local-smoke.html"
      - "research/tests/v430_browser_bridge_smoke.cjs"
      - ".github/workflows/atlas-v430-browser-bridge.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-v430-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-browser-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned research inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and WebKit for supported Ubuntu
        run: |
          mkdir -p /tmp/atlas-v430-browser research/artifacts/V430_browser_bridge
          npm install --prefix /tmp/atlas-v430-browser --no-save --no-package-lock playwright@1.56.1
          /tmp/atlas-v430-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Exercise actual V4.29 JSON in both engines
        id: smoke
        env:
          NODE_PATH: /tmp/atlas-v430-browser/node_modules
        run: |
          set +e
          node research/tests/v430_browser_bridge_smoke.cjs > research/artifacts/V430_browser_bridge/V430_BROWSER_STDOUT.txt 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          tail -100 research/artifacts/V430_browser_bridge/V430_BROWSER_STDOUT.txt
          exit 0
      - name: Persist browser test evidence only on research branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/artifacts/V430_browser_bridge/
          if ! git diff --cached --quiet; then
            git commit -m 'test(atlas): V4.30 actual local ES bridge browser evidence [skip ci]'
            git push origin HEAD:refs/heads/research/atlas-v430-l0-private-staging-runtime-bridge
          fi
      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v430-actual-browser-bridge-evidence
          path: research/artifacts/V430_browser_bridge/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce real browser verdict
        if: always()
        env:
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
        run: |
          test "$SMOKE_EXIT" = 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/artifacts/V430_browser_bridge/V430_BROWSER_BRIDGE_RESULTS.json').read_text())
          assert j['status']=='PASS' and j['failed']==0,j
          assert j['realAiStudioStageExecuted'] is False
          PY
