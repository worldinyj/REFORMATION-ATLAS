name: Atlas V189 Article IV editorial parallel QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v189_*'
      - 'scripts/validate_atlas_v189.py'
      - '.github/workflows/atlas-v189-editorial-parallel.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v189.py
      - run: python3 scripts/validate_atlas_v188.py
