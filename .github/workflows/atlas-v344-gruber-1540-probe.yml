name: ATLAS V3.44 contemporary 1540 Gruber print image source sample
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v344_gruber_1540_article_x.py
