name: Atlas V242 Sophia 1525 lexical interpretation and Gotha archive provenance QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v242_gotha_cyprian_rebinding_and_sophia_1525_lexical_source_criticism.json'
      - 'docs/01_CONTENT/V242_GOTHA_1717_ARCHIVE_REBINDING_AND_SOPHIA_1525_FLUCHEN_FLIeHEN_SOURCE_REPORT.md'
      - 'scripts/validate_atlas_v242.py'
      - '.github/workflows/atlas-v242-sophia-lexical-and-gotha-provenance-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v242_gotha_cyprian_rebinding_and_sophia_1525_lexical_source_criticism.json'
      - 'docs/01_CONTENT/V242_GOTHA_1717_ARCHIVE_REBINDING_AND_SOPHIA_1525_FLUCHEN_FLIeHEN_SOURCE_REPORT.md'
      - 'scripts/validate_atlas_v242.py'
