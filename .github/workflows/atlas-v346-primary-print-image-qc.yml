name: ATLAS V3.46 two 1540 Article X original print QC samples
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-original-print-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/research_v346_primary_1540_article_x_images.py
