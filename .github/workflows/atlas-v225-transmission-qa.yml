name: Atlas V225 Marburg documentary transmission QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v225_marburg_fair_copy_print_transmission.json'
      - 'scripts/validate_atlas_v225.py'
      - 'docs/01_CONTENT/V225_MARBURG_THREE_FAIR_COPIES_AND_PRINT_TRANSMISSION_REPORT.md'
      - '.github/workflows/atlas-v225-transmission-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v225_marburg_fair_copy_print_transmission.json'
      - 'scripts/validate_atlas_v225.py'
      - 'docs/01_CONTENT/V225_MARBURG_THREE_FAIR_COPIES_AND_PRINT_TRANSMISSION_REPORT.md'
      - '.github/workflows/atlas-v225-transmission-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V225 research validator
        run: python3 -m py_compile scripts/validate_atlas_v225.py
      - name: V219 structured corpus check
        run: python3 scripts/validate_atlas_v219.py
      - name: V220 critical variant check
        run: python3 scripts/validate_atlas_v220.py
      - name: V221 accession ledger check
        run: python3 scripts/validate_atlas_v221.py
      - name: V222 image route checks
        run: python3 scripts/validate_atlas_v222.py
      - name: V223 date and edited transcription checks
        run: python3 scripts/validate_atlas_v223.py
      - name: V224 offline source acquisition checks
        run: python3 scripts/validate_atlas_v224.py
      - name: V225 document transmission and print history checks
        run: python3 scripts/validate_atlas_v225.py
