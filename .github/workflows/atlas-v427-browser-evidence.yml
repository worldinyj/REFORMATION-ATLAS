name: ATLAS V4.27 Browser Evidence
on:
  push:
    branches:
      - research/atlas-v427-browser-visual-evidence-l0
    paths:
      - ".github/workflows/atlas-v427-browser-evidence.yml"
      - "preview/V424_L0_EDITORIAL_ALPHA_OFFLINE_PREVIEW.html"
      - "research/tests/v426_multi_engine_browser_probe.cjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright engines
        run: |
          mkdir -p /tmp/atlas-v427-tools
          npm install --prefix /tmp/atlas-v427-tools --no-save --no-package-lock playwright@1.56.1
          /tmp/atlas-v427-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Run exact-source Chromium and WebKit checks
        id: e2e
        env:
          NODE_PATH: /tmp/atlas-v427-tools/node_modules
        run: |
          set +e
          ATLAS_BROWSER_ENGINE=chromium node research/tests/v426_multi_engine_browser_probe.cjs
          CHROME_CODE=$?
          ATLAS_BROWSER_ENGINE=webkit node research/tests/v426_multi_engine_browser_probe.cjs
          WEBKIT_CODE=$?
          echo "chromium_exit=$CHROME_CODE" >> "$GITHUB_OUTPUT"
          echo "webkit_exit=$WEBKIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Keep JSON results in research branch
        if: always()
        env:
          E_CHROMIUM: ${{ steps.e2e.outputs.chromium_exit }}
          E_WEBKIT: ${{ steps.e2e.outputs.webkit_exit }}
        run: |
          mkdir -p research/artifacts/V427_browser_evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('research/artifacts/V426_browser_checks')
          dst=Path('research/artifacts/V427_browser_evidence')
          names=['chromium','webkit']
          out={'version':'V4.27','source':'preview/V424_L0_EDITORIAL_ALPHA_OFFLINE_PREVIEW.html','engines':{},'release':{'can_ship':False,'actual_human_review_completed':False}}
          for name in names:
              reports=list((root/name).glob('V426_*_BROWSER_REPORT.json'))
              result=json.loads(reports[0].read_text()) if reports else None
              out['engines'][name]={'report_present':result is not None,'test_report':result,'exit_code':os.environ.get('E_'+name.upper())}
          (dst/'V427_BROWSER_E2E_RESULTS.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/artifacts/V427_browser_evidence/V427_BROWSER_E2E_RESULTS.json
          for engine in chromium webkit; do
            for name in desktop-volumes mobile-volumes small-mobile-themes; do
              img="research/artifacts/V426_browser_checks/$engine/$name.png"
              if test -f "$img"; then git add "$img"; fi
            done
          done
          if ! git diff --cached --quiet; then
            git commit -m 'test(atlas): V4.27 real browser evidence [skip ci]'
            git push origin HEAD:refs/heads/research/atlas-v427-browser-visual-evidence-l0
          fi
      - name: Upload complete screenshots and JSON logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v427-full-browser-evidence
          path: |
            research/artifacts/V426_browser_checks/
            research/artifacts/V427_browser_evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Final browser verdict
        if: always()
        env:
          E_CHROMIUM: ${{ steps.e2e.outputs.chromium_exit }}
          E_WEBKIT: ${{ steps.e2e.outputs.webkit_exit }}
        run: |
          test "$E_CHROMIUM" = 0
          test "$E_WEBKIT" = 0
