name: ATLAS V4.27 Browser Evidence Review
on:
  pull_request:
    branches:
      - research/atlas-v426-responsive-ux-browser-matrix-l0
    paths:
      - ".github/workflows/atlas-v427-browser-evidence.yml"
      - "research/tests/v427_browser_evidence.cjs"
      - "research/tests/v426_multi_engine_browser_probe.cjs"
      - "preview/V424_L0_EDITORIAL_ALPHA_OFFLINE_PREVIEW.html"
  push:
    branches:
      - research/atlas-v427-browser-evidence-review-l0
    paths:
      - ".github/workflows/atlas-v427-browser-evidence.yml"
      - "research/tests/v427_browser_evidence.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-evidence:
    name: ${{ matrix.engine }} at 4 viewports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - name: Checkout proposed research changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser engines
        run: |
          mkdir -p /tmp/atlas-v427-playwright
          npm install --prefix /tmp/atlas-v427-playwright --no-save --no-package-lock playwright@1.56.1
          /tmp/atlas-v427-playwright/node_modules/.bin/playwright install --with-deps "${{ matrix.engine }}"
      - name: Execute browser screenshots and content verification
        env:
          NODE_PATH: /tmp/atlas-v427-playwright/node_modules
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node research/tests/v427_browser_evidence.cjs
      - name: Upload screenshots and JSON evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v427-${{ matrix.engine }}-evidence
          path: research/artifacts/V427_browser_evidence/${{ matrix.engine }}/
          retention-days: 14
          if-no-files-found: warn
