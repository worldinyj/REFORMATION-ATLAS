name: ATLAS Phase 1 research preview and reader-contract QA

on:
  push:
    branches:
      - integration/atlas-phase1-browser-qa-v452
    paths:
      - 'integrations/atlas-flagship-phase1/**'
      - 'research/data/ATLAS_V457_*'
      - 'research/data/ATLAS_V458_*'
      - 'research/data/ATLAS_V459_*'
      - 'research/data/ATLAS_V460_*'
      - 'research/data/ATLAS_V461_*'
      - 'research/data/ATLAS_V462_*'
      - 'research/data/ATLAS_V463_*'
      - 'research/data/ATLAS_V464_*'
      - 'research/data/ATLAS_V465_*'
      - 'research/data/ATLAS_V466_*'
      - 'research/data/ATLAS_V467_*'
      - 'research/data/ATLAS_V468_*'
      - 'research/data/ATLAS_V469_*'
      - 'research/data/ATLAS_V470_*'
      - 'research/data/ATLAS_V471_*'
      - 'research/data/ATLAS_V472_*'
      - 'research/data/ATLAS_V473_*'
      - 'research/data/ATLAS_V474_*'
      - 'research/data/ATLAS_V475_*'
      - 'research/data/ATLAS_V476_*'
      - 'research/data/ATLAS_V477_*'
      - 'research/data/ATLAS_V478_*'
      - 'research/data/ATLAS_V479_*'
      - 'research/data/ATLAS_V480_*'
      - 'research/data/ATLAS_V481_*'
      - '.github/workflows/atlas-phase1-browser-qa.yml'

permissions:
  contents: read

jobs:
  research-contract:
    name: Research claim and pilot schema contract
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate claim register, pilot instrument and offline scorer
        run: node --test integrations/atlas-flagship-phase1/reader-pilot-contract.test.mjs integrations/atlas-flagship-phase1/v458-evidence-contract.test.mjs integrations/atlas-flagship-phase1/v459-witness-contract.test.mjs integrations/atlas-flagship-phase1/v460-critical-apparatus-contract.test.mjs integrations/atlas-flagship-phase1/v461-manuscript-edition-source-contract.test.mjs integrations/atlas-flagship-phase1/v462-primary-source-evidence-contract.test.mjs integrations/atlas-flagship-phase1/v463-original-print-witness-contract.test.mjs integrations/atlas-flagship-phase1/v464-early-print-parallel-contract.test.mjs integrations/atlas-flagship-phase1/v465-zurich-original-print-colophon-contract.test.mjs integrations/atlas-flagship-phase1/v466-print-setting-provenance-contract.test.mjs integrations/atlas-flagship-phase1/v467-kz-autograph-acquisition-contract.test.mjs integrations/atlas-flagship-phase1/v468-kz-gmail-draft-and-early-facsimile-contract.test.mjs integrations/atlas-flagship-phase1/v469-heppe-bibliography-and-textual-history-contract.test.mjs integrations/atlas-flagship-phase1/v470-reader-copytext-and-bibliographic-contract.test.mjs integrations/atlas-flagship-phase1/v471-sentence-provenance-and-review-contract.test.mjs integrations/atlas-flagship-phase1/v472-editorial-revision-evidence-contract.test.mjs integrations/atlas-flagship-phase1/v473-preview-bridge-contract.test.mjs integrations/atlas-flagship-phase1/v474-react-reader-pack-contract.test.mjs integrations/atlas-flagship-phase1/v475-cross-volume-review-contract.test.mjs integrations/atlas-flagship-phase1/v475-review-documents-contract.test.mjs integrations/atlas-flagship-phase1/v476-vol05-cross-volume-contract.test.mjs integrations/atlas-flagship-phase1/v476-vol05-preview-contract.test.mjs integrations/atlas-flagship-phase1/v477-cross-volume-reading-contract.test.mjs integrations/atlas-flagship-phase1/v477-react-reader-interface-contract.test.mjs integrations/atlas-flagship-phase1/v478-eight-volume-portfolio-contract.test.mjs integrations/atlas-flagship-phase1/v479-tamil-reader-source-contract.test.mjs integrations/atlas-flagship-phase1/v480-vol02-stele-source-contract.test.mjs integrations/atlas-flagship-phase1/v481-vol07-korean-history-source-contract.test.mjs

  browser-smoke:
    name: Browser smoke (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: integrations/atlas-flagship-phase1
    steps:
      - name: Checkout current research branch (not main)
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 typescript@5.9.3 esbuild@0.25.12 react@19.2.0 react-dom@19.2.0
      - name: Install test browser and runtime libraries
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check already authored synthetic DOM tests
        run: node --test preview.test.mjs react-contract.test.mjs markdown-contract.test.mjs
      - name: Test real browser engine
        run: node --test browser-smoke.test.mjs browser-v473.test.mjs browser-react-v474.test.mjs browser-v475-handout.test.mjs browser-v476-vol05.test.mjs browser-react-v477.test.mjs
        env:
          ATLAS_BROWSER: ${{ matrix.engine }}
      - name: Upload viewport evidence (screenshots only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-phase1-${{ matrix.engine }}-v477
          path: integrations/atlas-flagship-phase1/qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
