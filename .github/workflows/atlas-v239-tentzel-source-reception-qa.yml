name: Atlas V239 Tentzel 231-folio German reception and 1717 source edition QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v239_tentzel_german_fair_copy_and_1717_print_reception.json'
      - 'docs/01_CONTENT/V239_TENTZEL_231_FOLIOS_1717_RECEPTION_AND_SECKENDORFF_EDITION_AUDIT.md'
      - 'scripts/validate_atlas_v239.py'
      - '.github/workflows/atlas-v239-tentzel-source-reception-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v239_tentzel_german_fair_copy_and_1717_print_reception.json'
      - 'docs/01_CONTENT/V239_TENTZEL_231_FOLIOS_1717_RECEPTION_AND_SECKENDORFF_EDITION_AUDIT.md'
      - 'scripts/validate_atlas_v239.py'
      - '.github/workflows/atlas-v239-tentzel-source-reception-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V239 manuscript and print provenance checker
        run: python3 -m py_compile scripts/validate_atlas_v239.py
      - name: V219 historical research regression
        run: python3 scripts/validate_atlas_v219.py
      - name: V220 historical research regression
        run: python3 scripts/validate_atlas_v220.py
      - name: V221 historical research regression
        run: python3 scripts/validate_atlas_v221.py
      - name: V222 historical research regression
        run: python3 scripts/validate_atlas_v222.py
      - name: V223 historical research regression
        run: python3 scripts/validate_atlas_v223.py
      - name: V224 historical research regression
        run: python3 scripts/validate_atlas_v224.py
      - name: V225 historical research regression
        run: python3 scripts/validate_atlas_v225.py
      - name: V226 historical research regression
        run: python3 scripts/validate_atlas_v226.py
      - name: V227 historical research regression
        run: python3 scripts/validate_atlas_v227.py
      - name: V228 historical research regression
        run: python3 scripts/validate_atlas_v228.py
      - name: V229 historical research regression
        run: python3 scripts/validate_atlas_v229.py
      - name: V230 historical research regression
        run: python3 scripts/validate_atlas_v230.py
      - name: V231 historical research regression
        run: python3 scripts/validate_atlas_v231.py
      - name: V232 historical research regression
        run: python3 scripts/validate_atlas_v232.py
      - name: V233 historical research regression
        run: python3 scripts/validate_atlas_v233.py
      - name: V234 historical research regression
        run: python3 scripts/validate_atlas_v234.py
      - name: V235 historical research regression
        run: python3 scripts/validate_atlas_v235.py
      - name: V236 historical research regression
        run: python3 scripts/validate_atlas_v236.py
      - name: V237 historical research regression
        run: python3 scripts/validate_atlas_v237.py
      - name: V238 historical research regression
        run: python3 scripts/validate_atlas_v238.py
      - name: V239 historical research regression
        run: python3 scripts/validate_atlas_v239.py
