name: Atlas V241 Franciscan 1521 dual editions and Sophia 1525 autograph QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v241_franciscan_1521_dual_print_and_sophia_1525_original_copy.json'
      - 'docs/01_CONTENT/V241_FRANCISCAN_1521_DUAL_EDITION_AND_SOPHIA_1525_AUTOGRAPH_COPY_REPORT.md'
      - 'scripts/validate_atlas_v241.py'
      - '.github/workflows/atlas-v241-1521-franciscan-1525-sophia-source-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v241_franciscan_1521_dual_print_and_sophia_1525_original_copy.json'
      - 'docs/01_CONTENT/V241_FRANCISCAN_1521_DUAL_EDITION_AND_SOPHIA_1525_AUTOGRAPH_COPY_REPORT.md'
      - 'scripts/validate_atlas_v241.py'
      - '.github/workflows/atlas-v241-1521-franciscan-1525-sophia-source-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V241 witness and edition provenance verifier
