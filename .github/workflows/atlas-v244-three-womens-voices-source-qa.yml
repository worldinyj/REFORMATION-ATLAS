name: Atlas V244 1524–1526 three women's source provenance and WA15 text QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v244_1524_florentina_1525_sophia_1526_helfta_holzzelle_three_witness_perspectives.json'
      - 'docs/01_CONTENT/V244_FLORENTINA_1524_SOPHIA_1525_HELFTA_HOLZZELLE_1526_WOMENS_VOICES_REPORT.md'
      - 'scripts/validate_atlas_v244.py'
