name: Atlas V182 edition transmission audit
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v182_*'
      - 'scripts/validate_atlas_v182.py'
      - '.github/workflows/atlas-v182-transmission.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v182.py
      - run: python3 scripts/validate_atlas_v181.py
