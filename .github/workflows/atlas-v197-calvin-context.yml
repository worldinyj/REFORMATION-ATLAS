name: Atlas V197 Calvin contextual variant QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v197_*'
      - 'scripts/validate_atlas_v197.py'
      - '.github/workflows/atlas-v197-calvin-context.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v197.py
      - run: python3 scripts/validate_atlas_v196.py
