name: Atlas V181 textual variant QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/contracts/atlas_v181_*'
      - 'scripts/validate_atlas_v181.py'
      - '.github/workflows/atlas-v181-textual-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v181.py
      - run: python3 scripts/validate_atlas_v180.py
