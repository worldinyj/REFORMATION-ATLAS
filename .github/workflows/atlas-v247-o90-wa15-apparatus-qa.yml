name: Atlas V247 O90 and WA15 printed apparatus QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v247_o90_o91_paired_loci_wa15_printed_apparatus_audit.json'
      - 'docs/01_CONTENT/V247_O90_O91_PAIRED_LOCI_WA15_PRINTED_APPARATUS_REPORT.md'
      - 'scripts/validate_atlas_v247.py'
      - '.github/workflows/atlas-v247-o90-wa15-apparatus-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v247_o90_o91_paired_loci_wa15_printed_apparatus_audit.json'
      - 'docs/01_CONTENT/V247_O90_O91_PAIRED_LOCI_WA15_PRINTED_APPARATUS_REPORT.md'
      - 'scripts/validate_atlas_v247.py'
      - '.github/workflows/atlas-v247-o90-wa15-apparatus-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical research V219 to V247 regression
        run: |
          set -e
          for version in $(seq 219 247); do
            python3 "scripts/validate_atlas_v${version}.py"
          done
