name: Atlas V240 primary-language 1519–1525 and Cyprian 1718 textual witness QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v240_1519_1521_1525_documents_and_cyprian_1718_witnesses.json'
      - 'docs/01_CONTENT/V240_CYPRIAN_1718_1519_1521_1525_PRIMARY_TEXTUAL_WITNESSES_AND_HISTORY_REPORT.md'
      - 'scripts/validate_atlas_v240.py'
      - '.github/workflows/atlas-v240-1519-1525-critical-text-witnesses-qa.yml'
  pull_request:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v240_1519_1521_1525_documents_and_cyprian_1718_witnesses.json'
      - 'docs/01_CONTENT/V240_CYPRIAN_1718_1519_1521_1525_PRIMARY_TEXTUAL_WITNESSES_AND_HISTORY_REPORT.md'
      - 'scripts/validate_atlas_v240.py'
      - '.github/workflows/atlas-v240-1519-1525-critical-text-witnesses-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V240 witness source validator
        run: python3 -m py_compile scripts/validate_atlas_v240.py
      - name: Historical research V219
        run: python3 scripts/validate_atlas_v219.py
      - name: Historical research V220
        run: python3 scripts/validate_atlas_v220.py
      - name: Historical research V221
        run: python3 scripts/validate_atlas_v221.py
