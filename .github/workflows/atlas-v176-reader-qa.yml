name: Atlas V176 substantive reader QA
on:
  push:
    branches: ['research/**']
    paths:
      - 'data/deep/atlas_v176_*'
      - 'scripts/validate_atlas_v176.py'
      - '.github/workflows/atlas-v176-reader-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_atlas_v176.py
      - run: python3 scripts/validate_atlas_v175.py
      - run: python3 scripts/validate_atlas_v174.py
