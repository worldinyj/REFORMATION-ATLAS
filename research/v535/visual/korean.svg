<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 463" role="img" aria-labelledby="title desc"><title id="title">한국어 성경 간행</title><desc id="desc">번역 범위와 출판 단계를 구분</desc><rect width="1000" height="463" fill="#faf8f2"/><g font-family="Noto Sans KR, sans-serif" fill="#24332f"><text x="40" y="46" font-size="30" font-weight="bold" text-anchor="start" fill="#24332f">한국어 성경 간행</text><text x="40" y="78" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">번역 범위와 출판 단계를 구분</text><rect x="40" y="110" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="136" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1882 · 복음서</text><text x="58" y="159" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">누가복음·요한복음</text><rect x="40" y="187" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="213" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1887 · 신약 전권</text><text x="58" y="236" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">로스 계열 예수성교전서</text><rect x="40" y="264" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="290" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1900 · 위원회역 시험본</text><text x="58" y="313" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">서울·요코하마 인쇄물 구분</text><rect x="40" y="341" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="367" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1911 · 신구약 합본</text><text x="58" y="390" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">성경전서</text><text x="40" y="428" font-size="16" font-weight="normal" text-anchor="start" fill="#24332f">1900년 인쇄본의 본문 이문 직접 대조 미완료</text></g></svg>