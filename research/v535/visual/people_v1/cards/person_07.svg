<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">루터 상징형 인물 카드</title><desc id="desc">회개·은총·교회 권위을 표현하는 자체 제작 도형. 인물의 외모가 아님.</desc><rect width="360" height="480" fill="#f7f3e9"/><rect x="15" y="15" width="330" height="450" rx="9" fill="none" stroke="#b1b7a5"/><g font-family="Noto Sans KR, sans-serif" fill="#263a34" text-anchor="middle"><text x="180" y="48" font-size="12" letter-spacing="3">REFORMATION ATLAS</text><circle cx="180" cy="182" r="105" fill="#e5eade" stroke="#b2bba8"/><g transform="translate(180 182)" stroke="#355e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-51 -67 H31 L56 -42 V68 H-51 Z M31 -67 V-42 H56 M-32 -29 H36 M-32 -9 H36 M-32 11 H36 M-32 31 H20"/><path d="M-66 -55 H-78 V74 H43" stroke-dasharray="4 6"/></g><text x="180" y="317" font-size="27" font-weight="bold">루터</text><text x="180" y="341" font-size="16">Martin Luther</text><text x="180" y="370" font-size="15">1517년 · 독일</text><path d="M65 390 H295" stroke="#b1b7a5"/><text x="180" y="415" font-size="16" font-weight="bold">회개·은총·교회 권위</text><text x="180" y="445" font-size="12" fill="#66786d">상징 삽화 · 실제 초상 아님</text></g></svg>