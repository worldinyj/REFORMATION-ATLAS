<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">시몽 킴방구 상징형 인물 카드</title><desc id="desc">지역 교회의 주체성을 표현하는 자체 제작 도형. 인물의 외모가 아님.</desc><rect width="360" height="480" fill="#f7f3e9"/><rect x="15" y="15" width="330" height="450" rx="9" fill="none" stroke="#b1b7a5"/><g font-family="Noto Sans KR, sans-serif" fill="#263a34" text-anchor="middle"><text x="180" y="48" font-size="12" letter-spacing="3">REFORMATION ATLAS</text><circle cx="180" cy="182" r="105" fill="#e5eade" stroke="#b2bba8"/><g transform="translate(180 182)" stroke="#355e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="0" cy="-24" r="18"/><circle cx="-51" cy="-6" r="14"/><circle cx="51" cy="-6" r="14"/><path d="M-32 46 Q-30 0 0 0 Q30 0 32 46 M-83 46 Q-80 12 -51 12 Q-34 12 -27 26 M83 46 Q80 12 51 12 Q34 12 27 26"/></g><text x="180" y="317" font-size="27" font-weight="bold">시몽 킴방구</text><text x="180" y="341" font-size="16">Simon Kimbangu</text><text x="180" y="370" font-size="15">1921년 · 콩고</text><path d="M65 390 H295" stroke="#b1b7a5"/><text x="180" y="415" font-size="16" font-weight="bold">지역 교회의 주체성</text><text x="180" y="445" font-size="12" fill="#66786d">상징 삽화 · 실제 초상 아님</text></g></svg>