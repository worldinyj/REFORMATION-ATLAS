<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">과만 포마 상징형 인물 카드</title><desc id="desc">기록과 식민 권력을 표현하는 자체 제작 도형. 인물의 외모가 아님.</desc><rect width="360" height="480" fill="#f7f3e9"/><rect x="15" y="15" width="330" height="450" rx="9" fill="none" stroke="#b1b7a5"/><g font-family="Noto Sans KR, sans-serif" fill="#263a34" text-anchor="middle"><text x="180" y="48" font-size="12" letter-spacing="3">REFORMATION ATLAS</text><circle cx="180" cy="182" r="105" fill="#e5eade" stroke="#b2bba8"/><g transform="translate(180 182)" stroke="#355e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-54" y="-70" width="108" height="138" rx="5"/><path d="M-36 -44 H32 M-36 -28 H32 M-36 -12 H10 M-36 5 H32 M-36 21 H32 M-36 37 H6"/><path d="M20 45 L72 -40 Q90 -63 72 -70 Q50 -66 43 -44 L12 44 Z" fill="#e6d9c1"/></g><text x="180" y="317" font-size="27" font-weight="bold">과만 포마</text><text x="180" y="341" font-size="16">Felipe Guaman Poma de Ayala</text><text x="180" y="370" font-size="15">약 1615년 · 안데스·페루</text><path d="M65 390 H295" stroke="#b1b7a5"/><text x="180" y="415" font-size="16" font-weight="bold">기록과 식민 권력</text><text x="180" y="445" font-size="12" fill="#66786d">상징 삽화 · 실제 초상 아님</text></g></svg>