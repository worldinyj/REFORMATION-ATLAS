<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">아우크스부르크 신앙고백</title><desc id="desc">문헌 단계 비교 · 완전한 판본 계통도 아님</desc><rect width="1000" height="540" fill="#faf8f2"/><g font-family="Noto Sans KR, sans-serif" fill="#24332f"><text x="40" y="46" font-size="30" font-weight="bold" text-anchor="start" fill="#24332f">아우크스부르크 신앙고백</text><text x="40" y="78" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">문헌 단계 비교 · 완전한 판본 계통도 아님</text><rect x="40" y="110" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="136" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1530 · 제출</text><text x="58" y="159" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">독일어·라틴어 신앙고백 / 비공인 인쇄도 별도</text><rect x="40" y="187" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="213" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1531 · 공인 인쇄</text><text x="58" y="236" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">언어와 인쇄 형태가 복수 존재</text><rect x="40" y="264" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="290" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1531 · 변증서</text><text x="58" y="313" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">신앙고백에 대한 별도의 변호 문헌</text><rect x="40" y="341" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="367" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1540 · Variata</text><text x="58" y="390" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">라틴어 개정 형태 / 모든 1540년판이 Variata인 것은 아님</text><rect x="40" y="418" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="444" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1858 · Corpus Reformatorum</text><text x="58" y="467" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">후대 교감판 / 16세기 원판과 구별</text><text x="40" y="505" font-size="16" font-weight="normal" text-anchor="start" fill="#24332f">제10조 원판 직접 교감 미완료</text></g></svg>