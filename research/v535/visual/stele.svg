<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" role="img" aria-labelledby="title desc"><title id="title">경교비의 사건과 기록</title><desc id="desc">사건 날짜와 증언 날짜를 구분</desc><rect width="1000" height="386" fill="#faf8f2"/><g font-family="Noto Sans KR, sans-serif" fill="#24332f"><text x="40" y="46" font-size="30" font-weight="bold" text-anchor="start" fill="#24332f">경교비의 사건과 기록</text><text x="40" y="78" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">사건 날짜와 증언 날짜를 구분</text><rect x="40" y="110" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="136" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">635 · 회고된 사건</text><text x="58" y="159" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">아라본의 도착 이야기</text><rect x="40" y="187" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="213" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">781 · 비문 건립</text><text x="58" y="236" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">약 146년 뒤 공동체가 과거를 기록</text><rect x="40" y="264" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="290" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">후대 · 탁본과 전사</text><text x="58" y="313" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">제작 시기가 다른 파생 기록</text><text x="40" y="351" font-size="16" font-weight="normal" text-anchor="start" fill="#24332f">635년의 동시대 일기가 아니라 781년의 회고 자료</text></g></svg>