<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">세계 기독교 병행 역사</title><desc id="desc">시대별 비교 행; 시간 비례 및 직접 인과 아님</desc><rect width="1000" height="620" fill="#faf8f2"/><g font-family="Noto Sans KR, sans-serif" fill="#24332f"><text x="40" y="48" font-size="30" font-weight="bold" text-anchor="start" fill="#24332f">세계 기독교 · 병행 역사</text><text x="40" y="78" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">선별 사건 · 행은 시간 비례 또는 직접 인과 관계를 뜻하지 않음</text><text x="55" y="117" font-size="20" font-weight="bold" text-anchor="start" fill="#24332f">유럽·지중해</text><text x="545" y="117" font-size="20" font-weight="bold" text-anchor="start" fill="#24332f">다른 지역 및 교차 지역</text><rect x="40" y="135" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="135" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="155" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">325</text><text x="56" y="176" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">니케아 공의회</text><text x="546" y="155" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">4세기</text><text x="546" y="176" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">악숨 왕실의 기독교 수용</text><rect x="40" y="196" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="196" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="216" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">451</text><text x="56" y="237" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">칼케돈 공의회</text><text x="546" y="216" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">781</text><text x="546" y="237" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">중국 경교비</text><rect x="40" y="257" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="257" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="277" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1054</text><text x="56" y="298" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">동서 교회의 갈등</text><text x="546" y="277" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1287–1288</text><text x="546" y="298" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">라반 사우마 유럽 방문</text><rect x="40" y="318" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="318" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="338" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1517</text><text x="56" y="359" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">루터의 면죄부 논쟁</text><text x="546" y="338" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1548–1549</text><text x="546" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">게에즈어 신약 인쇄(로마)</text><rect x="40" y="379" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="379" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="399" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1648</text><text x="56" y="420" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">베스트팔렌 평화</text><text x="546" y="399" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">약 1615</text><text x="546" y="420" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">과만 포마 연대기</text><rect x="40" y="440" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="440" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="460" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">18세기</text><text x="56" y="481" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">감리교 부흥</text><text x="546" y="460" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1714 / 1715</text><text x="546" y="481" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">타밀어 부분본 / 신약 간행*</text><rect x="40" y="501" width="450" height="52" rx="10" fill="#e9efed" stroke="#c6cdc2"/><rect x="530" y="501" width="430" height="52" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="56" y="521" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1910</text><text x="56" y="542" font-size="20" font-weight="normal" text-anchor="start" fill="#24332f">에든버러 선교대회</text><text x="546" y="521" font-size="15" font-weight="bold" text-anchor="start" fill="#24332f">1921</text><text x="546" y="542" font-size="19" font-weight="normal" text-anchor="start" fill="#24332f">킴방구 운동</text><text x="40" y="590" font-size="16" font-weight="normal" text-anchor="start" fill="#24332f">* 1715년 간행 지지 근거 존재 · 1719년 기관 기록은 별도 미해결</text></g></svg>