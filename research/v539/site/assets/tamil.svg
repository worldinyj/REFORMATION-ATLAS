<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 463" role="img" aria-labelledby="title desc"><title id="title">타밀어 신약 간행</title><desc id="desc">간행 기록과 기관 설명의 증거 수준 구분</desc><rect width="1000" height="463" fill="#faf8f2"/><g font-family="Noto Sans KR, sans-serif" fill="#24332f"><text x="40" y="46" font-size="30" font-weight="bold" text-anchor="start" fill="#24332f">타밀어 신약 간행</text><text x="40" y="78" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">간행 기록과 기관 설명의 증거 수준 구분</text><rect x="40" y="110" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="136" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1706 · 선교 활동 시작</text><text x="58" y="159" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">트랑케바르 / 인도 기독교의 최초 시작 아님</text><rect x="40" y="187" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="213" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1714 · 부분 간행</text><text x="58" y="236" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">사복음서·사도행전</text><rect x="40" y="264" width="920" height="64" rx="10" fill="#e9efed" stroke="#c6cdc2"/><text x="58" y="290" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1715 · 신약 간행</text><text x="58" y="313" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">기존 학술·소장 근거 및 표제지 자료</text><rect x="40" y="341" width="920" height="64" rx="10" fill="#f2ebdc" stroke="#c6cdc2"/><text x="58" y="367" font-size="21" font-weight="bold" text-anchor="start" fill="#24332f">1719 · 기관 기록</text><text x="58" y="390" font-size="17" font-weight="normal" text-anchor="start" fill="#24332f">인도성서공회 전권 출판 설명 / 관계 미해결</text><text x="40" y="428" font-size="16" font-weight="normal" text-anchor="start" fill="#24332f">1719년을 확정된 개정판 또는 최초 완간으로 표시하지 않음</text></g></svg>