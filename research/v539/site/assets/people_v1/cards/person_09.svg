<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">테스파 시온 상징형 인물 카드</title><desc id="desc">게에즈어 문헌과 인쇄을 표현하는 자체 제작 도형. 인물의 외모가 아님.</desc><rect width="360" height="480" fill="#f7f3e9"/><rect x="15" y="15" width="330" height="450" rx="9" fill="none" stroke="#b1b7a5"/><g font-family="Noto Sans KR, sans-serif" fill="#263a34" text-anchor="middle"><text x="180" y="48" font-size="12" letter-spacing="3">REFORMATION ATLAS</text><circle cx="180" cy="182" r="105" fill="#e5eade" stroke="#b2bba8"/><g transform="translate(180 182)" stroke="#355e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-74 -56 H74 M-58 -56 V67 M58 -56 V67 M-72 67 H72 M0 -56 V-16 M-33 -16 H33 M-45 12 H45 M-37 12 V39 H37 V12"/><rect x="-30" y="39" width="60" height="18" rx="2"/></g><text x="180" y="317" font-size="27" font-weight="bold">테스파 시온</text><text x="180" y="341" font-size="16">Täsfa Ṣeyon</text><text x="180" y="370" font-size="15">1548–1549년 · 에티오피아·로마</text><path d="M65 390 H295" stroke="#b1b7a5"/><text x="180" y="415" font-size="16" font-weight="bold">게에즈어 문헌과 인쇄</text><text x="180" y="445" font-size="12" fill="#66786d">상징 삽화 · 실제 초상 아님</text></g></svg>