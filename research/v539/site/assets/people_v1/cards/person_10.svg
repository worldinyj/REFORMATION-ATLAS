<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">소르 후아나 상징형 인물 카드</title><desc id="desc">신앙과 학문적 발언권을 표현하는 자체 제작 도형. 인물의 외모가 아님.</desc><rect width="360" height="480" fill="#f7f3e9"/><rect x="15" y="15" width="330" height="450" rx="9" fill="none" stroke="#b1b7a5"/><g font-family="Noto Sans KR, sans-serif" fill="#263a34" text-anchor="middle"><text x="180" y="48" font-size="12" letter-spacing="3">REFORMATION ATLAS</text><circle cx="180" cy="182" r="105" fill="#e5eade" stroke="#b2bba8"/><g transform="translate(180 182)" stroke="#355e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-77 62 H77 M-77 -60 H77 M-77 -60 V62 M77 -60 V62 M-77 0 H77"/><rect x="-64" y="-48" width="18" height="48"/><rect x="-40" y="-41" width="22" height="41"/><rect x="10" y="-51" width="18" height="51"/><path d="M39 -45 L60 -50 L71 -4 L50 0 Z M-63 12 H-36 V62 H-63 Z M-26 19 H-7 V62 H-26 Z M8 12 H35 V62 H8 Z M44 19 H65 V62 H44 Z"/></g><text x="180" y="317" font-size="27" font-weight="bold">소르 후아나</text><text x="180" y="341" font-size="16">Sor Juana Inés de la Cruz</text><text x="180" y="370" font-size="15">1691년 · 뉴에스파냐</text><path d="M65 390 H295" stroke="#b1b7a5"/><text x="180" y="415" font-size="16" font-weight="bold">신앙과 학문적 발언권</text><text x="180" y="445" font-size="12" fill="#66786d">상징 삽화 · 실제 초상 아님</text></g></svg>