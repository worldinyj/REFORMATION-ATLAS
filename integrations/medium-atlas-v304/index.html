<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>종교개혁 ATLAS · 심화 읽기</title>
  <link rel="stylesheet" href="./reader.css">
  <script type="module" src="./reader.mjs"></script>
</head>
<body>
  <a class="skip" href="#results">검색 결과로 바로 가기</a>
  <header class="masthead">
    <div><p class="eyebrow">REFORMATION ATLAS</p><h1>종교개혁, 더 깊이 읽기</h1>
      <p>인물과 사건, 문헌을 연결해 변화의 맥락을 살펴봅니다.</p></div>
    <span class="badge">편집 검토본</span>
  </header>
  <main>
    <section class="explore" aria-label="해설 찾기">
      <form id="search-form" role="search">
        <label for="query">무엇이 궁금한가요?</label>
        <div class="search-row"><input id="query" name="q" type="search" placeholder="예: 루터, 카를 5세, 성찬" maxlength="200"><button type="submit">찾기</button></div>
        <div class="filters">
          <div><label for="type">분야</label><select id="type"><option value="">모든 분야</option></select></div>
          <div><label for="path">함께 읽는 경로</label><select id="path"><option value="">모든 해설</option></select></div>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">해설을 불러오고 있습니다.</p>
      <div id="load-error" hidden><p>자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p><button id="retry" type="button">다시 불러오기</button></div>
    </section>
    <div class="workspace">
      <section id="results" class="result-panel" tabindex="-1" aria-label="검색 결과">
        <div id="path-intro"></div><h2 id="result-title">해설 목록</h2><ul id="reader-list" class="reader-list"></ul>
        <nav id="pagination" aria-label="검색 결과 페이지"></nav>
      </section>
      <article id="detail" class="detail" aria-label="선택한 해설"><h2 tabindex="-1">해설을 선택해 주세요</h2><p>목록에서 한 편을 고르면 본문과 질문, 관련 해설과 출처를 읽을 수 있습니다.</p></article>
    </div>
  </main>
  <footer>이 자료는 편집 중입니다. 출처 접근 확인과 역사 전문 감수는 구분하며, 자료별 확인 범위를 함께 표시합니다.</footer>
</body>
</html>
