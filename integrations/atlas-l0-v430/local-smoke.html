<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>ATLAS V4.30 · Local L0 Bridge Smoke Test</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#29362f;background:#f7f6f1;line-height:1.8}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #826b36;outline-offset:3px}
header,main,footer{padding:16px clamp(14px,4vw,38px);max-width:1150px;margin:auto}
header h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(1.4rem,4.4vw,2.6rem);line-height:1.3}
small,footer{color:#5e7166}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}
nav button{background:#edf0e9;border:1px solid #c9d4c8;border-radius:10px;padding:12px;color:inherit}
nav button[aria-current=page]{background:#2f5b4b;color:white}
input{border:1px solid #c9d4c8;border-radius:10px;background:white;padding:12px 14px;width:100%}
main{min-height:300px}h2{margin-top:6px;line-height:1.4}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.items button,.links button{background:white;border:1px solid #d8dcd2;border-radius:12px;text-align:left;padding:15px;min-width:0;white-space:normal;overflow-wrap:anywhere}
.items button strong,.items button span{display:block}.items button span{font-size:.88rem;color:#647168}
.article{background:white;border:1px solid #d8dcd2;border-radius:13px;padding:clamp(17px,3.4vw,32px);min-width:0}
.article pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;margin:0;line-height:2}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:24px 0}
#state{color:#496453;font-size:.88rem;margin-top:10px}#search-hits{font-size:.86rem}
@media(max-width:680px){nav{gap:5px}nav button{padding:9px 6px;font-size:.77rem}.items,.links{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header>
<small>REFORMATION ATLAS · V4.30 · LOCAL CONTRACT EXERCISE · NOT A LIVE AI STUDIO APP</small>
<h1>상위 역사 콘텐츠 연계 검증</h1>
<p>이 페이지는 V4.29의 실제 자료를 V4.30 읽기 전용 브리지로 소비하는 로컬 검증 화면입니다. 로그인·배포·역사 감수·사람 대상 독해 시험을 수행하지 않습니다.</p>
<nav aria-label="콘텐츠 구분">
  <button id="volumes-tab" data-mode="volumes" type="button" aria-current="page">여덟 권</button>
  <button id="themes-tab" data-mode="themes" type="button">여섯 주제</button>
  <button id="chapters-tab" data-mode="chapters" type="button">입문 읽기</button>
</nav>
<input id="search-box" type="search" autocomplete="off" placeholder="후스, 성찬, 한국..." aria-label="원고 검색">
<p id="state" role="status" data-status="INIT">로컬 데이터 연결 확인 중</p>
</header>
<main id="content" tabindex="-1" aria-label="원고 내용"></main>
<footer>내부 검토 전용 원고 · 외부 공개 차단 유지 · can_ship=false · 읽기 응답 저장 없음</footer>
<script type="module">
import {createAtlasL0ReadOnlyBridge} from "./bridge.mjs";
const safeHost=new Set(["127.0.0.1","localhost","::1","[::1]"]);
const state=document.querySelector("#state"),main=document.querySelector("#content");
const query=document.querySelector("#search-box"),tabs=[...document.querySelectorAll("[data-mode]")];
const el=(tag,text,cls)=>{
  const n=document.createElement(tag);
  if(text!==undefined)n.textContent=String(text);
  if(cls)n.className=cls;
  return n;
};
let atlas,mode="volumes";
function focusMain(){main.focus({preventScroll:true});}
function button(label,action){
  const b=el("button",label);b.type="button";b.addEventListener("click",action);return b;
}
function switchMode(next){
  mode=next;query.value="";
  tabs.forEach(b=>b.setAttribute("aria-current",b.dataset.mode===mode?"page":"false"));
  renderCatalog();focusMain();
}
function renderCatalog(){
  const group=atlas.catalog[mode],names={volumes:"역사권 8개",themes:"핵심 주제 6개",chapters:"입문 장면 6개"};
  const h=el("h2",names[mode]);const list=el("div",undefined,"items");
  for(const rec of group){
    const kind=mode==="volumes"?"VOLUME":mode==="themes"?"THEME":"CHAPTER";
    const b=button(rec.id+" · "+rec.title,()=>showRecord(kind,rec.id));
    b.dataset.recordId=rec.id;b.dataset.recordKind=kind;
    list.append(b);
  }
  main.replaceChildren(h,list);
  state.textContent=names[mode]+" / 원고 원본 V4.23 / 공개 보류";
}
function showRecord(kind,id){
  const rec=atlas.resolve({kind,id});if(!rec)throw Error("Unregistered route: "+kind+"/"+id);
  const back=button("← 목록",()=>{renderCatalog();focusMain()});
  const article=el("article",undefined,"article");
  article.append(el("h2",rec.title),el("pre",rec.bodyMarkdown));
  const detail=el("div");
  detail.append(back,article);
  if(kind==="THEME"){
    const links=el("div",undefined,"links");
    for(const link of rec.links){
      const b=button(link.targetId+" · "+link.title,()=>showRecord("VOLUME",link.targetId));
      b.dataset.targetId=link.targetId;
      links.append(b);
    }
    detail.append(el("h3","일곱 역사권으로 이동"),links);
  }
  main.replaceChildren(detail);
  state.textContent=kind+" / "+id+" / 비공개 검토용";
  focusMain();
}
function showSearch(){
  const q=query.value;
  const results=atlas.search(q);
  const list=el("div",undefined,"items");
  for(const hit of results){
    const b=button(hit.kind+" · "+hit.title,()=>showRecord(hit.kind,hit.id));
    b.dataset.recordId=hit.id;list.append(b);
  }
  const h=el("h2","검색 결과 "+results.length+"건");
  main.replaceChildren(h,list);
  state.textContent=q?"검색: "+q+" / "+results.length+"건":"검색어 없음";
}
(async()=>{
 try{
   if(!safeHost.has(location.hostname))throw Error("LOCAL_HOST_ONLY: never serve this fixture on a public domain");
   const resp=await fetch("../../handoff/V429_AI_STUDIO_PRIVATE_L0_CONTENT_IMPORT.json",{cache:"no-store"});
   if(!resp.ok)throw Error("Cannot read locally staged V4.29 dataset");
   const payload=await resp.json();
   // This only declares an isolated local test fixture; it is NOT user login.
   atlas=createAtlasL0ReadOnlyBridge(payload,{environment:"PRIVATE_STAGING",accessControlDeclared:true});
   tabs.forEach(b=>b.addEventListener("click",()=>switchMode(b.dataset.mode)));
   query.addEventListener("input",showSearch);
   renderCatalog();
   state.dataset.status="READY";
 }catch(e){state.dataset.status="BLOCKED";state.textContent="실행 차단: "+e.message;main.replaceChildren();}
})();
</script></body></html>
